<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Microsoft YaHei", sans-serif;
    color: #eee;
    user-select: none;
  }
  h1 { margin-bottom: 10px; font-size: 28px; letter-spacing: 8px; color: #4ecca3; }
  #score-board {
    display: flex;
    gap: 30px;
    margin-bottom: 12px;
    font-size: 18px;
  }
  #score-board span { color: #4ecca3; font-weight: bold; }
  canvas {
    background: #16213e;
    border: 3px solid #4ecca3;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(78, 204, 163, 0.3);
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
  }
  #overlay h2 { font-size: 36px; color: #e94560; }
  #overlay p { font-size: 16px; color: #ccc; }
  #overlay button {
    padding: 12px 40px;
    font-size: 18px;
    border: none;
    border-radius: 6px;
    background: #4ecca3;
    color: #1a1a2e;
    cursor: pointer;
    font-weight: bold;
    font-family: inherit;
  }
  #overlay button:hover { background: #3ba583; }
  .hidden { display: none !important; }
  #tips { margin-top: 12px; font-size: 13px; color: #888; }
</style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div id="score-board">
    <div>得分：<span id="score">0</span></div>
    <div>最高分：<span id="best">0</span></div>
    <div>速度：<span id="speed">1</span></div>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="tips">方向键 / WASD 控制 ｜ 空格 暂停</div>

  <div id="overlay">
    <h2 id="overlay-title">游戏结束</h2>
    <p id="overlay-text">按下按钮或按空格重新开始</p>
    <button onclick="restart()">重新开始</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;                 // 格子数
const CELL = canvas.width / GRID; // 每格像素

let snake, dir, nextDir, food, score, best = 0, speedLevel;
let timer = null, paused = false, gameOver = false;

function init() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  speedLevel = 1;
  gameOver = false;
  paused = false;
  placeFood();
  updateBoard();
  document.getElementById('overlay').classList.add('hidden');
  startLoop();
}

function startLoop() {
  clearInterval(timer);
  // 得分越多速度越快：基础 150ms，每 50 分提速一档，最快 60ms
  const interval = Math.max(60, 150 - Math.floor(score / 50) * 15);
  speedLevel = Math.floor((150 - interval) / 15) + 1;
  timer = setInterval(tick, interval);
}

function placeFood() {
  while (true) {
    const f = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID)
    };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
  }
}

function tick() {
  if (paused || gameOver) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙或撞自己
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (score > best) best = score;
    placeFood();
    startLoop(); // 提速
  } else {
    snake.pop();
  }
  updateBoard();
  draw();
}

function updateBoard() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('speed').textContent = speedLevel;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 画食物
  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // 画蛇（头部颜色深一点）
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ecca3' : `hsl(160, 60%, ${55 - Math.min(i, 25)}%)`;
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });

  // 画眼睛
  const h = snake[0];
  ctx.fillStyle = '#1a1a2e';
  const cx = h.x * CELL, cy = h.y * CELL;
  ctx.fillRect(cx + 5, cy + 5, 4, 4);
  ctx.fillRect(cx + CELL - 9, cy + 5, 4, 4);
}

function endGame() {
  gameOver = true;
  clearInterval(timer);
  document.getElementById('overlay-title').textContent = '游戏结束';
  document.getElementById('overlay-text').textContent = `本局得分：${score} 分`;
  document.getElementById('overlay').classList.remove('hidden');
}

function restart() {
  init();
}

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (key === ' ') {
    e.preventDefault();
    if (gameOver) { restart(); return; }
    paused = !paused;
    return;
  }
  const dirs = {
    arrowup: {x: 0, y: -1}, w: {x: 0, y: -1},
    arrowdown: {x: 0, y: 1}, s: {x: 0, y: 1},
    arrowleft: {x: -1, y: 0}, a: {x: -1, y: 0},
    arrowright: {x: 1, y: 0}, d: {x: 1, y: 0},
  };
  const nd = dirs[key];
  if (!nd) return;
  e.preventDefault();
  // 禁止 180 度掉头
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
});

init();
</script>
</body>
</html>
