<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEED FOR SPEED · NEON NIGHT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#04050a; touch-action:none;
    font-family:"Arial Black","Segoe UI",Arial,sans-serif; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; }
  canvas#gl { display:block; width:100%; height:100%; }

  /* ---------- HUD ---------- */
  .hud { position:fixed; z-index:10; color:#e8f6ff; pointer-events:none; text-shadow:0 0 8px rgba(0,229,255,.8); }
  #topbar { top:calc(8px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    display:flex; gap:18px; align-items:center; font-size:14px; letter-spacing:2px; }
  #pos { font-size:26px; color:#ffe14d; text-shadow:0 0 12px rgba(255,200,0,.9); min-width:64px; text-align:center;}
  #lap { color:#7df9ff; }
  #time { color:#fff; opacity:.9; font-variant-numeric:tabular-nums; }

  #mapbox { top:calc(8px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left));
    border:1px solid rgba(0,229,255,.4); border-radius:8px; background:rgba(2,8,16,.55); padding:3px; }
  #map { display:block; width:110px; height:110px; }

  #speedbox { bottom:calc(14px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    text-align:center; }
  #speed { font-size:44px; color:#fff; line-height:1; text-shadow:0 0 14px rgba(0,229,255,.9); font-variant-numeric:tabular-nums;}
  #speed small { font-size:13px; color:#7df9ff; letter-spacing:2px; }
  #nitrobar { width:150px; height:8px; margin:6px auto 0; border:1px solid rgba(0,229,255,.6); border-radius:4px; overflow:hidden; background:rgba(0,20,30,.6);}
  #nitrofill { height:100%; width:60%; background:linear-gradient(90deg,#00e5ff,#7df9ff,#fff); box-shadow:0 0 10px #00e5ff; transition:width .08s linear;}
  #nitrobar.full #nitrofill { animation:pulse .5s infinite alternate; }
  @keyframes pulse { from{filter:brightness(1);} to{filter:brightness(1.8);} }

  /* ---------- corner buttons ---------- */
  .cbtn { position:fixed; z-index:20; width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(0,229,255,.7); background:rgba(0,20,30,.55); color:#7df9ff;
    font-size:19px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    text-shadow:0 0 8px rgba(0,229,255,.9); }
  .cbtn:active { background:rgba(0,229,255,.35); }
  #fsBtn { top:calc(8px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right)); }
  #resetBtn { top:calc(58px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right)); font-size:22px; }
  #hint { position:fixed; z-index:10; bottom:calc(120px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    color:#9adcff; font-size:12px; letter-spacing:1px; opacity:.7; pointer-events:none; text-align:center; }
  body.touch #hint { display:none; }
  /* keep HUD clear of pedals/joystick on phones */
  body.touch #speedbox { left:auto; right:calc(8px + env(safe-area-inset-right));
    top:calc(108px + env(safe-area-inset-top)); bottom:auto; transform:none; text-align:right; }
  body.touch #speed { font-size:32px; }
  body.touch #nitrobar { width:110px; margin-left:auto; }
  body.touch #topbar { top:calc(128px + env(safe-area-inset-top)); font-size:12px; gap:10px; }
  body.touch #pos { font-size:20px; }

  /* ---------- touch controls ---------- */
  .tctl { display:none; }
  body.touch .tctl { display:block; }
  #stick { position:fixed; z-index:15; bottom:calc(24px + env(safe-area-inset-bottom)); left:calc(20px + env(safe-area-inset-left));
    width:130px; height:130px; border-radius:50%; border:2px solid rgba(0,229,255,.45);
    background:radial-gradient(circle,rgba(0,40,60,.35) 0%,rgba(0,20,35,.55) 100%); }
  #knob { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#9ff3ff,#0090b8 70%); box-shadow:0 0 16px rgba(0,229,255,.8); }
  .pbtn { position:fixed; z-index:15; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#eafcff; font-weight:bold; letter-spacing:1px; border:2px solid; }
  #btnGas  { right:calc(22px + env(safe-area-inset-right)); bottom:calc(30px + env(safe-area-inset-bottom));
    width:96px; height:96px; font-size:18px; border-color:rgba(0,255,140,.7);
    background:radial-gradient(circle,rgba(0,80,45,.55),rgba(0,40,25,.75)); text-shadow:0 0 10px #00ff8c; }
  #btnBrake { right:calc(132px + env(safe-area-inset-right)); bottom:calc(24px + env(safe-area-inset-bottom));
    width:72px; height:72px; font-size:14px; border-color:rgba(255,80,80,.75);
    background:radial-gradient(circle,rgba(90,10,15,.55),rgba(50,5,10,.75)); text-shadow:0 0 10px #ff5050; }
  #btnNos { right:calc(40px + env(safe-area-inset-right)); bottom:calc(142px + env(safe-area-inset-bottom));
    width:66px; height:66px; font-size:15px; border-color:rgba(120,180,255,.8);
    background:radial-gradient(circle,rgba(20,50,120,.6),rgba(10,25,70,.8)); text-shadow:0 0 12px #7df9ff; }
  .pbtn.on { filter:brightness(1.7); transform:scale(.94); }

  /* ---------- overlays ---------- */
  .ovl { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center,rgba(4,10,25,.82),rgba(1,2,8,.95)); color:#e8f6ff; text-align:center; }
  .title { font-size:min(11vw,64px); letter-spacing:4px; color:#fff;
    text-shadow:0 0 18px #00e5ff,0 0 46px #00e5ff,0 0 90px #06f; }
  .subtitle { font-size:min(5vw,22px); color:#ff2fb3; letter-spacing:8px; margin-top:4px;
    text-shadow:0 0 16px #ff2fb3; }
  .tip { margin-top:26px; font-size:14px; line-height:1.9; color:#9adcff; letter-spacing:1px; }
  .go { margin-top:30px; padding:14px 46px; font-size:20px; letter-spacing:6px; color:#041018;
    background:linear-gradient(90deg,#00e5ff,#7df9ff); border:none; border-radius:40px; cursor:pointer;
    box-shadow:0 0 24px rgba(0,229,255,.8); font-family:inherit; font-weight:bold; }
  .go:active { transform:scale(.95); }
  #cd { display:none; font-size:120px; color:#ffe14d; text-shadow:0 0 30px rgba(255,200,0,.95); background:none; }
  #finish { display:none; }
  #finPos { font-size:min(16vw,84px); color:#ffe14d; text-shadow:0 0 24px rgba(255,200,0,.95); }
  #finTime { font-size:22px; color:#7df9ff; margin-top:8px; letter-spacing:2px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="game"><canvas id="gl"></canvas></div>

<!-- HUD -->
<div class="hud" id="topbar"><span id="pos">--</span><span id="lap">LAP 1/3</span><span id="time">0:00.00</span></div>
<div class="hud" id="mapbox"><canvas id="map" width="220" height="220"></canvas></div>
<div class="hud" id="speedbox">
  <div id="speed">0<small> KM/H</small></div>
  <div id="nitrobar"><div id="nitrofill"></div></div>
</div>
<div id="hint">W/↑ 油门 · S/↓ 刹车 · A/D 转向 · SHIFT 氮气 · 刹车+转向=漂移 · R 重置</div>

<!-- corner buttons -->
<div class="cbtn" id="fsBtn" title="全屏">⛶</div>
<div class="cbtn" id="resetBtn" title="重置回赛道">↺</div>

<!-- touch controls -->
<div class="tctl" id="stick"><div id="knob"></div></div>
<div class="tctl pbtn" id="btnGas">GAS</div>
<div class="tctl pbtn" id="btnBrake">BRK</div>
<div class="tctl pbtn" id="btnNos">N₂O</div>

<!-- overlays -->
<div class="ovl" id="start">
  <div class="title">NEED FOR SPEED</div>
  <div class="subtitle">NEON NIGHT</div>
  <div class="tip">3 圈 · 4 车竞速 · 夜晚霓虹都市<br>
    手机:左侧摇杆转向,GAS 油门,BRK 刹车(转弯时刹车=漂移),N₂O 氮气<br>
    电脑:WASD/方向键,SHIFT 氮气,R 重置</div>
  <button class="go" id="startBtn">START RACE</button>
</div>
<div class="ovl" id="cd">3</div>
<div class="ovl" id="finish">
  <div id="finPos">1st</div>
  <div id="finTime">TIME 0:00.00</div>
  <button class="go" id="againBtn">再来一局</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ============================================================
   NEED FOR SPEED · NEON NIGHT  — single-file arcade racer
   ============================================================ */
let isTouch = false;
/* only switch to touch mode after a REAL touch — touchscreen laptops
   report maxTouchPoints>0 and would otherwise kill keyboard steering */
addEventListener('touchstart', ()=>{
  if(!isTouch){ isTouch = true; document.body.classList.add('touch'); }
}, { passive:true });

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
scene.fog = new THREE.FogExp2(0x05060f, 0.0032);

const camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, 0.1, 1200);

scene.add(new THREE.HemisphereLight(0x4a5a8a, 0x0a0c14, 0.85));
const moon = new THREE.DirectionalLight(0x8fa8ff, 0.5);
moon.position.set(-120, 180, 60); scene.add(moon);
scene.add(new THREE.AmbientLight(0x223, 0.6));

/* ---------------- procedural textures ---------------- */
function canvasTex(w, h, draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); return t; }

const roadTex = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#191c22'; g.fillRect(0,0,w,h);
  for(let i=0;i<260;i++){ g.fillStyle='rgba(255,255,255,'+(Math.random()*0.05)+')';
    g.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
  g.fillStyle='#e8e8e8'; g.fillRect(6,0,5,h); g.fillRect(w-11,0,5,h);          // edge lines
  g.fillStyle='#ffd23f';                                                        // center dashes
  for(let y=0;y<h;y+=80) g.fillRect(w/2-4, y, 8, 44);
});
roadTex.wrapT = THREE.RepeatWrapping;

const wallTex = canvasTex(128,64,(g,w,h)=>{
  g.fillStyle='#0c0d12'; g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=32){ g.fillStyle='#c8232f'; g.beginPath();
    g.moveTo(x,h); g.lineTo(x+16,18); g.lineTo(x+32,18); g.lineTo(x+16,h); g.fill(); }
  g.fillStyle='#00e5ff'; g.fillRect(0,0,w,8);                                    // neon top rail
  g.fillStyle='rgba(255,255,255,.85)'; g.fillRect(0,8,w,2);
});
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;

function buildingTex(){ return canvasTex(128,256,(g,w,h)=>{
  g.fillStyle='#06070c'; g.fillRect(0,0,w,h);
  const cols=6, rows=14, cw=w/cols, rh=h/rows;
  for(let x=0;x<cols;x++) for(let y=0;y<rows;y++){
    if(Math.random()<0.42){
      const warm = Math.random()<0.55;
      g.fillStyle = warm ? 'rgba(255,205,120,'+(0.5+Math.random()*0.5)+')'
                         : 'rgba(120,220,255,'+(0.4+Math.random()*0.6)+')';
      g.fillRect(x*cw+3, y*rh+3, cw-6, rh-7);
    }
  }
});}
const bTexs = [buildingTex(), buildingTex(), buildingTex()];

const glowTex = canvasTex(64,64,(g,w,h)=>{
  const r=g.createRadialGradient(32,32,2,32,32,30);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(0.4,'rgba(255,255,255,.55)');
  r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,w,h);
});

/* ---------------- track ---------------- */
const ctrl = [
  [0,-230],[150,-215],[235,-140],[255,-20],[215,70],[230,160],[150,235],[40,225],
  [-50,245],[-165,225],[-245,135],[-255,10],[-205,-80],[-195,-175],[-100,-235]
].map(p=>new THREE.Vector3(p[0],0,p[1]));
const curve = new THREE.CatmullRomCurve3(ctrl, true, 'catmullrom', 0.6);

const N = 800;                                   // samples
const pts = curve.getSpacedPoints(N).slice(0,N);
const centers=[], tans=[], rights=[], curv=[];
for(let i=0;i<N;i++){
  const p=pts[i], q=pts[(i+1)%N];
  const t=q.clone().sub(p).normalize();
  centers.push(p); tans.push(t);
  rights.push(new THREE.Vector3(t.z,0,-t.x));    // consistent right vector
}
for(let i=0;i<N;i++) curv.push(tans[(i-1+N)%N].angleTo(tans[i]));
const SEG = curve.getLength()/N;
const W = 26;                                    // road width
const MAXLAT = W/2 - 1.6;

/* road ribbon */
(function buildRoad(){
  const pos=[], uv=[], idx=[];
  let v=0;
  for(let i=0;i<=N;i++){
    const j=i%N, c=centers[j], r=rights[j];
    pos.push(c.x+r.x*W/2, 0, c.z+r.z*W/2,  c.x-r.x*W/2, 0, c.z-r.z*W/2);
    uv.push(0,v, 1,v); v += SEG/12;
    if(i<N){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ map:roadTex })));
})();

/* walls (both sides) */
(function buildWalls(){
  const pos=[], uv=[], idx=[];
  for(let i=0;i<=N;i++){
    const j=i%N, c=centers[j], r=rights[j];
    for(let s=0;s<2;s++){
      const sg = s? 1 : -1, off = sg*(W/2+0.6), base=(i*2+s)*2;
      pos.push(c.x+r.x*off, 0, c.z+r.z*off,  c.x+r.x*off, 1.7, c.z+r.z*off);
      uv.push(i*0.5, s?1:0, i*0.5, s?0:1);
      if(i<N) idx.push(base, base+4, base+1, base+1, base+4, base+5);   // next ring = +4 verts
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.MeshLambertMaterial({ map:wallTex, side:THREE.DoubleSide, emissive:0x555566 });
  scene.add(new THREE.Mesh(g,m));
})();

/* ground */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2400,2400),
  new THREE.MeshBasicMaterial({ color:0x040509 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.08; scene.add(ground);

/* ---------------- city ---------------- */
(function buildCity(){
  const neonCols=[0xff2fb3,0x00e5ff,0x9d4dff,0x00ff9d,0xffe14d];
  const boxGeo = new THREE.BoxGeometry(1,1,1);
  const mats = bTexs.map(t=>new THREE.MeshBasicMaterial({ map:t }));
  let placed=0;
  for(let i=0;i<N && placed<110;i+=7){
    for(const side of [-1,1]){
      if(Math.random()<0.35) continue;
      const c=centers[i], r=rights[i];
      const dist = 55 + Math.random()*95;
      const bw = 18+Math.random()*26, bd = 18+Math.random()*26, bh = 22+Math.random()*75;
      const m = new THREE.Mesh(boxGeo, mats[(Math.random()*3)|0]);
      m.position.set(c.x+r.x*dist*side + (Math.random()-0.5)*30, bh/2-0.1, c.z+r.z*dist*side + (Math.random()-0.5)*30);
      m.scale.set(bw,bh,bd); m.rotation.y = Math.random()*Math.PI;
      scene.add(m);
      if(Math.random()<0.4){                                  // rooftop neon trim
        const trim = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ color:neonCols[(Math.random()*neonCols.length)|0] }));
        trim.scale.set(bw*0.85, 1.2, bd*0.85);
        trim.position.copy(m.position); trim.position.y = bh+0.5; trim.rotation.y = m.rotation.y;
        scene.add(trim);
      }
      placed++;
    }
  }
  /* neon poles along track */
  for(let i=0;i<N;i+=40){
    const c=centers[i], r=rights[i], side=(i/40)%2? 1:-1;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,7,6),
      new THREE.MeshLambertMaterial({ color:0x222833 }));
    pole.position.set(c.x+r.x*(W/2+4)*side, 3.5, c.z+r.z*(W/2+4)*side);
    scene.add(pole);
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.55,8,8),
      new THREE.MeshBasicMaterial({ color:neonCols[(i/40)%neonCols.length] }));
    lamp.position.set(pole.position.x, 7.2, pole.position.z);
    scene.add(lamp);
  }
})();

/* ---------------- car factory ---------------- */
function makeCar(bodyColor, neonColor){
  const car = new THREE.Group();
  const body = new THREE.MeshPhongMaterial({ color:bodyColor, shininess:90, specular:0x888888 });
  const glass = new THREE.MeshPhongMaterial({ color:0x0a0d14, shininess:120, specular:0xaaccff });
  const b = (w,h,d,x,y,z,mat)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat||body);
    m.position.set(x,y,z); car.add(m); return m; };
  b(2.0,0.45,4.3, 0,0.55,0);                       // chassis
  b(1.9,0.28,1.6, 0,0.86,1.1);                     // hood scoop area
  b(1.7,0.5,2.0, 0,1.02,-0.35, glass);             // cabin
  b(1.8,0.1,0.5, 0,1.28,-1.9);                     // spoiler blade
  b(0.12,0.32,0.12, -0.7,1.08,-1.9); b(0.12,0.32,0.12, 0.7,1.08,-1.9);
  const hl = new THREE.MeshBasicMaterial({ color:0xdfeeff });
  b(0.42,0.14,0.08, -0.62,0.62,2.16, hl); b(0.42,0.14,0.08, 0.62,0.62,2.16, hl);
  const tl = new THREE.MeshBasicMaterial({ color:0xff2038 });
  b(0.5,0.13,0.08, -0.6,0.66,-2.16, tl); b(0.5,0.13,0.08, 0.6,0.66,-2.16, tl);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(2.6,4.8),
    new THREE.MeshBasicMaterial({ color:neonColor, transparent:true, opacity:0.32, blending:THREE.AdditiveBlending, depthWrite:false }));
  glow.rotation.x = -Math.PI/2; glow.position.y = 0.06; car.add(glow);
  const wheelGeo = new THREE.CylinderGeometry(0.4,0.4,0.34,14);
  const wheelMat = new THREE.MeshPhongMaterial({ color:0x0b0b0d, shininess:30 });
  const hub = new THREE.MeshBasicMaterial({ color:0x99a2b8 });
  const wheels=[];
  [[-1,1.35],[1,1.35],[-1,-1.35],[1,-1.35]].forEach(([sx,z],k)=>{
    const w = new THREE.Group();
    const tire = new THREE.Mesh(wheelGeo, wheelMat); tire.rotation.z = Math.PI/2; w.add(tire);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,0.36,8), hub);
    cap.rotation.z = Math.PI/2; w.add(cap);
    w.position.set(sx*0.95, 0.4, z); car.add(w); wheels.push({ g:w, front:k<2 });
  });
  car.userData.wheels = wheels;
  return car;
}

/* ---------------- player ---------------- */
const player = {
  mesh: makeCar(0x18b6ff, 0x00e5ff),
  pos: new THREE.Vector3(), vel: new THREE.Vector3(),
  theta: 0, prog: 0, idx: 0, nitro: 60, lap: 0,
  finished: false, finTime: 0
};
scene.add(player.mesh);

/* headlight for player */
const head = new THREE.SpotLight(0xbfd8ff, 1.4, 55, 0.55, 0.45, 1.2);
player.mesh.add(head); head.position.set(0,1.2,2);
head.target.position.set(0,0,18); player.mesh.add(head.target);

/* ---------------- AI ---------------- */
const AI_TOP = [66, 62.5, 59];
const AI_COL = [[0xff7a1a,0xff9500],[0x37ff6a,0x00ff9d],[0xd94dff,0xff2fb3]];
const vmax = new Float32Array(N);
for(let i=0;i<N;i++){
  const k = Math.max(curv[i]/SEG, 1e-4);
  vmax[i] = Math.min(72, Math.sqrt(24/k));
}
const ais = AI_TOP.map((top,n)=>{
  const mesh = makeCar(AI_COL[n][0], AI_COL[n][1]);
  scene.add(mesh);
  return { mesh, s: 8+n*7, speed: 0, lane: [-5.5, 5.5, 0][n], top, name:'AI'+n, finProg: Infinity };
});

/* ---------------- grid placement ---------------- */
function placeOnTrack(obj, sIdx, lane){
  const i = ((Math.round(sIdx)%N)+N)%N;
  obj.pos.copy(centers[i]).addScaledVector(rights[i], lane);
  obj.pos.y = 0;
  obj.theta = Math.atan2(tans[i].x, tans[i].z);
  obj.vel = obj.vel || new THREE.Vector3();
  obj.vel.set(0,0,0);
  if(obj.mesh){ obj.mesh.position.copy(obj.pos); obj.mesh.rotation.y = obj.theta; }
}
placeOnTrack(player, 0, 2.5); player.idx = 0; player.prog = 0;
function aiMeshPlace(a){
  const i = ((Math.round(a.s)%N)+N)%N;
  a.mesh.position.copy(centers[i]).addScaledVector(rights[i], a.lane);
  a.mesh.rotation.y = Math.atan2(tans[i].x, tans[i].z);
}
ais.forEach(a=>aiMeshPlace(a));

/* ---------------- particles ---------------- */
const PMAX = 220;
const pPool = [];
for(let i=0;i<PMAX;i++){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false, color:0xffffff, opacity:0 }));
  sp.visible = false; scene.add(sp);
  pPool.push({ sp, life:0, max:1, vel:new THREE.Vector3(), grow:1, fade:1 });
}
let pNext = 0;
function emit(pos, vel, color, size, life, grow){
  const p = pPool[pNext]; pNext = (pNext+1)%PMAX;
  p.sp.visible = true; p.sp.position.copy(pos);
  p.sp.material.color.setHex(color); p.sp.material.opacity = 0.9;
  p.sp.scale.set(size,size,1);
  p.vel.copy(vel); p.life = p.max = life; p.grow = grow||1;
}
function updateParticles(dt){
  for(const p of pPool){
    if(p.life<=0) continue;
    p.life -= dt;
    if(p.life<=0){ p.sp.visible=false; p.sp.material.opacity=0; continue; }
    p.sp.position.addScaledVector(p.vel, dt);
    p.vel.y += 1.5*dt;
    const t = p.life/p.max;
    p.sp.material.opacity = 0.85*t;
    const s = p.sp.scale.x * (1 + p.grow*dt);
    p.sp.scale.set(s,s,1);
  }
}

/* ---------------- input ---------------- */
const input = { steer:0, gas:0, brake:0, nos:0 };
const keys = {};
addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='KeyR') resetToTrack();
});
addEventListener('keyup', e=>{ keys[e.code]=false; });

function pollKeys(){
  input.steer = (keys['ArrowLeft']||keys['KeyA']? -1:0) + (keys['ArrowRight']||keys['KeyD']? 1:0);
  input.gas   = (keys['ArrowUp']||keys['KeyW'])? 1:0;
  input.brake = (keys['ArrowDown']||keys['KeyS']||keys['Space'])? 1:0;
  input.nos   = (keys['ShiftLeft']||keys['ShiftRight'])? 1:0;
}

/* joystick */
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickId = null, touchSteer = 0;
function stickMove(t){
  const r = stick.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const max = r.width/2 - 10, len = Math.hypot(dx,dy);
  if(len > max){ dx *= max/len; dy *= max/len; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  touchSteer = Math.max(-1, Math.min(1, dx/max));
}
stick.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.changedTouches[0]; stickId=t.identifier; stickMove(t); }, {passive:false});
addEventListener('touchmove', e=>{
  for(const t of e.changedTouches) if(t.identifier===stickId){ stickMove(t); e.preventDefault(); }
}, {passive:false});
addEventListener('touchend', e=>{
  for(const t of e.changedTouches) if(t.identifier===stickId){
    stickId=null; touchSteer=0; knob.style.transform='translate(0,0)';
  }
});
/* pedals */
let touchGas=0, touchBrake=0, touchNos=0;
function bindBtn(el, set){
  el.addEventListener('touchstart', e=>{ e.preventDefault(); set(1); el.classList.add('on'); }, {passive:false});
  const off = e=>{ set(0); el.classList.remove('on'); };
  el.addEventListener('touchend', off); el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', e=>{ e.preventDefault(); set(1); el.classList.add('on'); });
  addEventListener('mouseup', ()=>{ set(0); el.classList.remove('on'); });
}
bindBtn(document.getElementById('btnGas'),  v=>touchGas=v);
bindBtn(document.getElementById('btnBrake'),v=>touchBrake=v);
bindBtn(document.getElementById('btnNos'),  v=>touchNos=v);

function readInput(){
  pollKeys();
  if(isTouch){
    if(touchSteer !== 0) input.steer = touchSteer;   // stick at rest → keep keyboard steer
    input.gas = Math.max(input.gas, touchGas);
    input.brake = Math.max(input.brake, touchBrake);
    input.nos = Math.max(input.nos, touchNos);
  }
}

/* ---------------- audio ---------------- */
let AC=null, engOsc=null, engGain=null, screech=null, screechGain=null;
function initAudio(){
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    engOsc = AC.createOscillator(); engOsc.type='sawtooth';
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    engGain = AC.createGain(); engGain.gain.value=0;
    engOsc.connect(lp); lp.connect(engGain); engGain.connect(AC.destination);
    engOsc.start();
    const buf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    screech = AC.createBufferSource(); screech.buffer=buf; screech.loop=true;
    const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400;
    screechGain = AC.createGain(); screechGain.gain.value=0;
    screech.connect(bp); bp.connect(screechGain); screechGain.connect(AC.destination);
    screech.start();
  }catch(e){}
}

/* ---------------- race state ---------------- */
const LAPS = 3, TOTAL = N*LAPS;
let racing = false, raceClock = 0, shake = 0;
const elPos=document.getElementById('pos'), elLap=document.getElementById('lap'),
      elTime=document.getElementById('time'), elSpeed=document.getElementById('speed'),
      elNitro=document.getElementById('nitrofill'), elNitroBar=document.getElementById('nitrobar');

function fmt(t){
  const m = Math.floor(t/60), s = t-m*60;
  return m+':'+(s<10?'0':'')+s.toFixed(2);
}
function suffix(n){ return ['1st','2nd','3rd','4th'][n-1]||n+'th'; }

function nearestIdx(p, hint){
  let best=hint, bd=Infinity;
  for(let k=-28;k<=28;k++){
    const i=((hint+k)%N+N)%N;
    const d=(p.x-centers[i].x)**2 + (p.z-centers[i].z)**2;
    if(d<bd){ bd=d; best=i; }
  }
  if(bd>1600){
    for(let i=0;i<N;i+=6){
      const d=(p.x-centers[i].x)**2 + (p.z-centers[i].z)**2;
      if(d<bd){ bd=d; best=i; }
    }
  }
  return best;
}
function resetToTrack(){
  placeOnTrack(player, player.idx, 0);
  player.vel.set(0,0,0);
}
document.getElementById('resetBtn').addEventListener('click', resetToTrack);

/* ---------------- physics ---------------- */
const MAXS = 76, NITROS = 94;
let drifting = false, nosActive = false;

function stepPlayer(dt){
  const fwd = new THREE.Vector3(Math.sin(player.theta),0,Math.cos(player.theta));
  const rgt = new THREE.Vector3(fwd.z,0,-fwd.x);
  let vF = player.vel.dot(fwd), vR = player.vel.dot(rgt);

  const speedRatio = Math.min(1, Math.abs(vF)/MAXS);
  drifting = input.brake>0 && Math.abs(input.steer)>0.35 && vF>18;
  nosActive = input.nos>0 && player.nitro>0 && input.gas>0 && vF>5;

  /* longitudinal */
  const top = nosActive? NITROS : MAXS;
  if(input.gas>0) vF += (nosActive? 40:24) * dt * (1 - Math.max(0,vF)/(top*1.18));
  if(input.brake>0 && !drifting){
    if(vF>1) vF -= 42*dt; else vF = Math.max(-14, vF - 12*dt);
  }
  vF -= (vF*0.028 + vF*Math.abs(vF)*0.00028) * dt;      // rolling + aero drag

  /* steering (steer=+1 means right; heading decreases toward -X) */
  const maxSteer = 0.62 - 0.44*speedRatio;
  let yaw = -input.steer * maxSteer * Math.min(Math.abs(vF)/6,1) * Math.sign(vF||1) * (drifting? 1.6:1);
  player.theta += yaw * dt * 2.6;

  /* lateral grip */
  vR *= Math.exp(-(drifting? 1.9 : 8.5)*dt);

  const nf = new THREE.Vector3(Math.sin(player.theta),0,Math.cos(player.theta));
  const nr = new THREE.Vector3(nf.z,0,-nf.x);
  player.vel.copy(nf).multiplyScalar(vF).addScaledVector(nr, vR);
  player.pos.addScaledVector(player.vel, dt);

  /* nitro meter */
  if(nosActive) player.nitro = Math.max(0, player.nitro - 34*dt);
  else player.nitro = Math.min(100, player.nitro + (drifting? 13:5.5)*dt);

  /* track constraint */
  player.idx = nearestIdx(player.pos, player.idx);
  const rel = player.pos.clone().sub(centers[player.idx]);
  let lat = rel.dot(rights[player.idx]);
  if(Math.abs(lat) > MAXLAT){
    lat = Math.sign(lat)*MAXLAT;
    player.pos.copy(centers[player.idx]).addScaledVector(rights[player.idx], lat);
    const vLat = player.vel.dot(rights[player.idx]);
    player.vel.addScaledVector(rights[player.idx], -vLat*1.4);
    player.vel.multiplyScalar(0.985);
    shake = Math.min(0.5, shake+0.18);
    if(Math.abs(vLat)>5){
      for(let k=0;k<3;k++)
        emit(player.pos.clone().add(new THREE.Vector3(0,0.5,0)),
             new THREE.Vector3((Math.random()-0.5)*6, 2+Math.random()*3, (Math.random()-0.5)*6),
             0xffc23f, 0.6, 0.35, 1);
    }
  }

  /* progress (unwrapped) */
  player.prog += ((player.idx - Math.round(player.prog)%N + N + N/2)%N) - N/2;
  if(player.prog < 0) player.prog = 0;
  player.lap = Math.min(LAPS, Math.floor(player.prog/N)+1);

  /* effects */
  if(drifting && Math.random()<0.8){
    const back = player.pos.clone().addScaledVector(nf, -1.8);
    back.y = 0.25;
    emit(back.clone().addScaledVector(nr, 0.9),  new THREE.Vector3((Math.random()-0.5)*2,1,(Math.random()-0.5)*2), 0x8a93a8, 1.2, 0.7, 2.4);
    emit(back.clone().addScaledVector(nr,-0.9),  new THREE.Vector3((Math.random()-0.5)*2,1,(Math.random()-0.5)*2), 0x8a93a8, 1.2, 0.7, 2.4);
  }
  if(nosActive){
    const ex = player.pos.clone().addScaledVector(nf, -2.2); ex.y = 0.55;
    emit(ex, nf.clone().multiplyScalar(-14).add(new THREE.Vector3(0,1,0)), Math.random()<0.5?0x33ccff:0xbf66ff, 1.1, 0.22, 0.5);
    shake = Math.min(0.35, shake + 2*dt);
  }

  /* AI collision */
  for(const a of ais){
    const dx = player.pos.x - a.mesh.position.x, dz = player.pos.z - a.mesh.position.z;
    const dist = Math.hypot(dx,dz);
    if(dist < 3.4 && dist > 0.01){
      const push = (3.4-dist)/2;
      player.pos.x += dx/dist*push; player.pos.z += dz/dist*push;
      player.vel.multiplyScalar(0.985);
      shake = Math.min(0.4, shake+0.1);
    }
  }

  /* write transform */
  player.mesh.position.copy(player.pos);
  player.mesh.rotation.y = player.theta;
  const ws = player.mesh.userData.wheels;
  for(const w of ws){
    w.g.children[0].rotation.x += vF*dt/0.4;
    if(w.front) w.g.rotation.y = -input.steer*0.42;
  }
  player.mesh.rotation.z = -input.steer*Math.min(1,Math.abs(vF)/40)*0.06 + (drifting? -input.steer*0.05:0);

  /* finish */
  if(!player.finished && player.prog >= TOTAL){
    player.finished = true; player.finTime = raceClock;
    showFinish();
  }
}

function stepAI(a, dt){
  const i = ((Math.round(a.s)%N)+N)%N;
  const look = Math.max(8, Math.min(70, a.speed*a.speed/(2*11)/SEG));
  let target = a.top;
  for(let k=0;k<look;k++) target = Math.min(target, vmax[(i+k)%N]);
  const gap = player.prog - a.s;                                // rubber band
  target *= 1 + Math.max(-0.07, Math.min(0.1, gap/(N*1.2)));
  a.speed += Math.max(-32*dt, Math.min(15*dt, target - a.speed));
  a.s += a.speed*dt/SEG;

  const j = ((Math.round(a.s)%N)+N)%N;
  const wander = Math.sin(a.s*0.013 + a.lane)*1.6;
  a.mesh.position.copy(centers[j]).addScaledVector(rights[j], a.lane + wander);
  a.mesh.rotation.y = Math.atan2(tans[j].x, tans[j].z);
  for(const w of a.mesh.userData.wheels) w.g.children[0].rotation.x += a.speed*dt/0.4;
}

/* ---------------- camera ---------------- */
const camPos = new THREE.Vector3(0,4,-10);
function stepCamera(dt){
  const fwd = new THREE.Vector3(Math.sin(player.theta),0,Math.cos(player.theta));
  const sp = player.vel.length();
  const dist = 8.6 + sp*0.03, h = 3.1 + sp*0.008;
  const desired = player.pos.clone().addScaledVector(fwd, -dist);
  desired.y += h;
  camPos.lerp(desired, 1 - Math.exp(-5.5*dt));
  camera.position.copy(camPos);
  if(shake>0.001){
    camera.position.x += (Math.random()-0.5)*shake;
    camera.position.y += (Math.random()-0.5)*shake*0.6;
    shake *= Math.exp(-6*dt);
  }
  const look = player.pos.clone().addScaledVector(fwd, 7); look.y += 1.1;
  camera.lookAt(look);
  const fovT = 66 + Math.min(1,sp/NITROS)*8 + (nosActive? 9:0);
  camera.fov += (fovT - camera.fov)*Math.min(1, 5*dt);
  camera.updateProjectionMatrix();
}

/* ---------------- minimap ---------------- */
const mapC = document.getElementById('map'), mg = mapC.getContext('2d');
let mapSC = 1, mapOX = 0, mapOY = 0;
(function fitMap(){
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(const p of centers){ minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z); }
  mapSC = Math.min(200/(maxX-minX), 200/(maxZ-minZ));
  mapOX = 110 - (minX+maxX)/2*mapSC;
  mapOY = 110 - (minZ+maxZ)/2*mapSC;
})();
const mp = (x,z)=>[x*mapSC+mapOX, z*mapSC+mapOY];
function drawMap(){
  mg.clearRect(0,0,220,220);
  mg.strokeStyle='rgba(0,229,255,.75)'; mg.lineWidth=5; mg.lineJoin='round';
  mg.beginPath();
  for(let i=0;i<=N;i+=8){ const [x,y]=mp(centers[i%N].x, centers[i%N].z); i? mg.lineTo(x,y):mg.moveTo(x,y); }
  mg.closePath(); mg.stroke();
  for(const a of ais){
    const [x,y]=mp(a.mesh.position.x, a.mesh.position.z);
    mg.fillStyle='#ff7a1a'; mg.beginPath(); mg.arc(x,y,5,0,7); mg.fill();
  }
  const [px,py]=mp(player.pos.x, player.pos.z);
  mg.fillStyle='#fff'; mg.save(); mg.translate(px,py); mg.rotate(Math.PI - player.theta);
  mg.beginPath(); mg.moveTo(0,-8); mg.lineTo(5,6); mg.lineTo(-5,6); mg.closePath(); mg.fill(); mg.restore();
}

/* ---------------- HUD ---------------- */
function standings(){
  const all = [{p:player.prog, me:true}].concat(ais.map(a=>({p:a.s, me:false})));
  all.sort((x,y)=>y.p-x.p);
  return all.findIndex(e=>e.me)+1;
}
function updateHUD(){
  const kmh = Math.round(player.vel.length()*3.6);
  elSpeed.innerHTML = kmh + '<small> KM/H</small>';
  elNitro.style.width = player.nitro+'%';
  elNitroBar.classList.toggle('full', player.nitro>98);
  elLap.textContent = 'LAP '+player.lap+'/'+LAPS;
  elPos.textContent = suffix(standings());
  elTime.textContent = fmt(player.finished? player.finTime : raceClock);
}

/* ---------------- overlays / flow ---------------- */
const cdEl = document.getElementById('cd');
document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('start').classList.add('hidden');
  initAudio();
  if(AC && AC.state==='suspended') AC.resume();
  cdEl.style.display='flex';
  let n = 3;
  cdEl.textContent = n;
  const iv = setInterval(()=>{
    n--;
    if(n>0){ cdEl.textContent = n; }
    else if(n===0){ cdEl.textContent = 'GO!'; cdEl.style.color='#37ff6a'; }
    else { clearInterval(iv); cdEl.style.display='none'; racing = true; }
  }, 800);
});
document.getElementById('againBtn').addEventListener('click', ()=>location.reload());

function showFinish(){
  const place = standings();
  document.getElementById('finPos').textContent = suffix(place);
  document.getElementById('finTime').textContent = 'TIME '+fmt(player.finTime)+
    (place===1? '  ·  🏆 冠军!' : '');
  document.getElementById('finish').style.display='flex';
}

/* fullscreen */
function toggleFS(){
  const d = document, el = d.documentElement;
  if(!d.fullscreenElement && !d.webkitFullscreenElement){
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    try{ screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(()=>{}); }catch(e){}
  } else {
    (d.exitFullscreen || d.webkitExitFullscreen || function(){}).call(d);
  }
}
document.getElementById('fsBtn').addEventListener('click', toggleFS);

/* ---------------- resize ---------------- */
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

/* ---------------- main loop ---------------- */
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = Math.min(0.05, (now-last)/1000); last = now;
  if(racing && !player.finished) raceClock += dt;
  if(racing){
    readInput();
    stepPlayer(dt);
    for(const a of ais) stepAI(a, dt);
  }
  updateParticles(dt);
  stepCamera(dt);
  updateHUD();
  drawMap();
  if(AC && engOsc){
    const sp = player.vel.length(), r = Math.min(1, sp/NITROS);
    engOsc.frequency.setTargetAtTime(60 + r*170 + (nosActive?45:0), AC.currentTime, 0.05);
    engGain.gain.setTargetAtTime(racing? 0.045 + r*0.035 : 0, AC.currentTime, 0.1);
    screechGain.gain.setTargetAtTime(drifting? 0.05 : 0, AC.currentTime, 0.08);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
})();
</script>
</body>
