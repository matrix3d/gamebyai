<script>
"use strict";
/* ============================================================
   Minecraft Clone —— 无限地图 / 水体 / 音效 / 日夜循环 / 生存

// ---------- 常量 ----------
const H = 48, CH = 16, CHUNK_R = 4, WL = 17;
const REACH = 7;
const GRAV = -26, JUMP_V = 9.0, SPEED = 4.6;
const EYE = 1.62, PR = 0.3, PH = 1.8;
const SKY = 0x87ceeb;
const DAY_LEN = 480;                 // 一昼夜(秒)

const B = { AIR:0, GRASS:1, DIRT:2, STONE:3, SAND:4, LOG:5, LEAF:6, PLANK:7, BRICK:8, WATER:9, GLASS:10, ROSE:11, TORCH:12,
  COAL_ORE:13, IRON_ORE:14, GOLD_ORE:15, DIAMOND_ORE:16, CAMPFIRE:17, CRAFT_TABLE:18, TNT:19, BED:20,
  CHEST:21, PLATE:22, DOOR:23, PORTAL:24, NETHERRACK:25, LAVA:26 };
const ITEM = { COAL:101, RAW:102, COOKED:103, RAWFISH:104, COOKEDFISH:105, WOOL:106, BOW:107, ELYTRA:108,
  RECALL:109, EGG:110, ROD:111, WPICK:112, SPICK:113, IPICK:114, IRON_INGOT:115, ARMOR:116, APPLE:117, BOAT:118 };
const HOTBAR = [B.GRASS, B.DIRT, B.STONE, B.SAND, B.LOG, B.PLANK, B.BRICK, B.GLASS, B.TORCH, B.CAMPFIRE, B.CRAFT_TABLE, B.TNT, B.BED,
  B.PLATE, B.DOOR, B.PORTAL, B.NETHERRACK];
const DROP_MAP = { [B.GRASS]:B.DIRT, [B.DIRT]:B.DIRT, [B.STONE]:B.STONE, [B.SAND]:B.SAND, [B.LOG]:B.LOG,
  [B.PLANK]:B.PLANK, [B.BRICK]:B.BRICK, [B.ROSE]:B.ROSE, [B.TORCH]:B.TORCH, [B.LEAF]:0, [B.GLASS]:0,
  [B.COAL_ORE]:ITEM.COAL, [B.IRON_ORE]:B.IRON_ORE, [B.GOLD_ORE]:B.GOLD_ORE, [B.DIAMOND_ORE]:B.DIAMOND_ORE,
  [B.CAMPFIRE]:B.CAMPFIRE, [B.CRAFT_TABLE]:B.CRAFT_TABLE, [B.TNT]:B.TNT, [B.BED]:B.BED,
  [B.CHEST]:0, [B.PLATE]:B.PLATE, [B.DOOR]:B.DOOR, [B.PORTAL]:B.PORTAL, [B.NETHERRACK]:B.NETHERRACK, [B.LAVA]:0 };
const PART_COLOR = { [B.GRASS]:0x6a9a3c, [B.DIRT]:0x8a6846, [B.STONE]:0x7f7f83, [B.SAND]:0xd4c39a,
  [B.LOG]:0x6b5236, [B.LEAF]:0x3f7a34, [B.PLANK]:0xab8a54, [B.BRICK]:0x9a4a3c, [B.GLASS]:0xcfe8f0,
  [B.ROSE]:0xc03030, [B.TORCH]:0xd8a040, [B.COAL_ORE]:0x4a4a4e, [B.IRON_ORE]:0xb08a64, [B.GOLD_ORE]:0xd8b040,
  [B.DIAMOND_ORE]:0x70d8e0, [B.CAMPFIRE]:0xd87030, [B.CRAFT_TABLE]:0xab8a54, [B.TNT]:0xd03028, [B.BED]:0xc03838,
  [B.CHEST]:0xb08a50, [B.PLATE]:0xab8a54, [B.DOOR]:0x9a7848, [B.PORTAL]:0x9040d0, [B.NETHERRACK]:0x8a4030, [B.LAVA]:0xf06018 };
const NAME = { 1:"草方块",2:"泥土",3:"石头",4:"沙子",5:"原木",6:"树叶",7:"木板",8:"砖块",10:"玻璃",11:"玫瑰",12:"火把",
  13:"煤矿石",14:"铁矿石",15:"金矿石",16:"钻石矿石",17:"篝火",18:"合成台",19:"TNT",20:"床",
  21:"宝箱",22:"压力板",23:"木门",24:"地狱门",25:"地狱岩",26:"岩浆",
  101:"煤",102:"生肉",103:"熟肉",104:"生鱼",105:"熟鱼",106:"羊毛",107:"弓",108:"鞘翅",
  109:"回城卷轴",110:"鸡蛋",111:"钓鱼竿",112:"木镐",113:"石镐",114:"铁镐",115:"铁锭",116:"铁甲",117:"苹果",118:"船" };
const RECIPES = [
  {out:B.PLANK,      n:4, need:{[B.LOG]:1},                     table:false},
  {out:B.TORCH,      n:4, need:{[ITEM.COAL]:1,[B.LOG]:1},       table:false},
  {out:B.CRAFT_TABLE,n:1, need:{[B.PLANK]:4},                   table:false},
  {out:ITEM.WPICK,   n:1, need:{[B.PLANK]:3},                   table:false},
  {out:B.PLATE,      n:1, need:{[B.PLANK]:2},                   table:false},
  {out:B.GLASS,      n:2, need:{[B.SAND]:2,[ITEM.COAL]:1},      table:true},
  {out:B.BRICK,      n:4, need:{[B.STONE]:4},                   table:true},
  {out:ITEM.SPICK,   n:1, need:{[B.STONE]:3,[B.PLANK]:1},       table:true},
  {out:B.DOOR,       n:1, need:{[B.PLANK]:4},                   table:true},
  {out:B.CAMPFIRE,   n:1, need:{[B.LOG]:3,[ITEM.COAL]:1},       table:true},
  {out:ITEM.BOAT,    n:1, need:{[B.PLANK]:5},                   table:true},
  {out:B.TNT,        n:2, need:{[B.SAND]:4,[ITEM.COAL]:2},      table:true},
  {out:B.BED,        n:1, need:{[B.PLANK]:3,[ITEM.WOOL]:2},     table:true},
  {out:ITEM.BOW,     n:1, need:{[B.PLANK]:3,[ITEM.WOOL]:2},     table:true},
  {out:ITEM.ROD,     n:1, need:{[B.PLANK]:2,[ITEM.WOOL]:2},     table:true},
  {out:ITEM.ELYTRA,  n:1, need:{[ITEM.WOOL]:4,[B.PLANK]:2},     table:true},
  {out:ITEM.IPICK,   n:1, need:{[ITEM.IRON_INGOT]:3,[B.PLANK]:1}, table:true},
  {out:ITEM.ARMOR,   n:1, need:{[ITEM.IRON_INGOT]:5},           table:true},
  {out:ITEM.RECALL,  n:1, need:{[B.DIAMOND_ORE]:1},             table:true},
  {out:B.PORTAL,     n:1, need:{[B.GOLD_ORE]:2,[ITEM.COAL]:2,[B.STONE]:4}, table:true},
];
// 镐子:[物品,挖掘间隔,等级] 取背包中最高级
const PICKS=[[ITEM.WPICK,0.16,1],[ITEM.SPICK,0.11,2],[ITEM.IPICK,0.07,3]];
const ORE_REQ={[B.IRON_ORE]:1,[B.GOLD_ORE]:2,[B.DIAMOND_ORE]:3};
function pickLevel(){ for(let i=PICKS.length-1;i>=0;i--) if((inv[PICKS[i][0]]||0)>0) return PICKS[i][2]; return 0; }
function mineSpeed(){ for(let i=PICKS.length-1;i>=0;i--) if((inv[PICKS[i][0]]||0)>0) return PICKS[i][1]; return 0.22; }
const TRADES=[
  {give:ITEM.RAW,     gn:2, get:ITEM.COAL,      tn:1},
  {give:ITEM.WOOL,    gn:3, get:ITEM.COOKED,    tn:1},
  {give:ITEM.RAWFISH, gn:2, get:ITEM.APPLE,     tn:2},
  {give:ITEM.EGG,     gn:4, get:ITEM.COAL,      tn:1},
  {give:ITEM.COAL,    gn:4, get:B.GOLD_ORE,     tn:1},
];
const isOpaqueB = b => b!==0 && b!==B.WATER && b!==B.GLASS && b!==B.ROSE && b!==B.TORCH && b!==B.PLATE && b!==B.LAVA;
const sstep = (a,b,x) => { const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };

// ---------- 随机数 & 噪声 ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash2(x,z){ let n=Math.imul(x,374761393)+Math.imul(z,668265263); n=Math.imul(n^n>>>13,1274126177); return ((n^n>>>16)>>>0)/4294967296; }
function smooth(t){ return t*t*(3-2*t); }
function vnoise(x,z){
  const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi;
  const a=hash2(xi,zi), b=hash2(xi+1,zi), c=hash2(xi,zi+1), d=hash2(xi+1,zi+1);
  const u=smooth(xf), v=smooth(zf);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,z){ let s=0,amp=1,f=1,tot=0; for(let i=0;i<4;i++){ s+=amp*vnoise(x*f,z*f); tot+=amp; amp*=.5; f*=2.1; } return s/tot; }
function hash3(x,y,z){ let n=Math.imul(x,374761393)+Math.imul(y,2246822519)+Math.imul(z,668265263); n=Math.imul(n^n>>>13,1274126177); return ((n^n>>>16)>>>0)/4294967296; }
function vnoise3(x,y,z){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi, u=smooth(xf), v=smooth(yf), w=smooth(zf);
  const c000=hash3(xi,yi,zi),     c100=hash3(xi+1,yi,zi);
  const c010=hash3(xi,yi+1,zi),   c110=hash3(xi+1,yi+1,zi);
  const c001=hash3(xi,yi,zi+1),   c101=hash3(xi+1,yi,zi+1);
  const c011=hash3(xi,yi+1,zi+1), c111=hash3(xi+1,yi+1,zi+1);
  const x00=c000+(c100-c000)*u, x10=c010+(c110-c010)*u;
  const x01=c001+(c101-c001)*u, x11=c011+(c111-c011)*u;
  const y0=x00+(x10-x00)*v, y1=x01+(x11-x01)*v;
  return y0+(y1-y0)*w;
}
function isCave(x,y,z){
  const n1=vnoise3(x*0.07, y*0.07, z*0.07);
  const n2=vnoise3(x*0.07+133.7, y*0.07, z*0.07);
  return n1*n1+n2*n2 < 0.011;                       // 双通道虫洞式隧道
}
function heightAt(x,z){
  let h = 9 + fbm(x*0.04, z*0.04)*21 + fbm(x*0.13, z*0.13)*3;
  const sea = fbm(x*0.008+300, z*0.008);            // 大尺度海盆,产生湖泊
  if(sea < 0.40) h -= (0.40-sea)*45;
  return Math.max(5, Math.min(H-14, Math.floor(h)));
}

// ---------- 区块存储 ----------
const chunksData  = new Map();
const chunkMeshes = new Map();
const EDITS       = new Map();
const torchSet    = new Set();
const fireSet     = new Set();
const plateSet    = new Set();
const doorSet     = new Set();
const doorOpen    = new Map();   // "x,y,z" -> 开门的截止时间戳
const ckey = (cx,cz) => cx+","+cz;

function genChunkData(cx,cz){
  const d = new Uint8Array(CH*H*CH);
  for(let lx=0;lx<CH;lx++) for(let lz=0;lz<CH;lz++){
    const x=cx*CH+lx, z=cz*CH+lz, h=heightAt(x,z);
    const beach = h<=WL+1;
    const neth = x>=50000;                        // 下界区域
    for(let y=0;y<H;y++){
      let b=0;
      if(y<=h){
        if(neth) b = y>h-4 ? B.NETHERRACK : B.STONE;
        else b = y===h   ? (beach?B.SAND:B.GRASS)
               : y>=h-3  ? (beach?B.SAND:B.DIRT)
               : B.STONE;
      } else if(y<=WL) b = neth?B.LAVA:B.WATER;
      if(b && b!==B.WATER && b!==B.LAVA && y>3 && y<h-2 && isCave(x,y,z)) b=0;   // 洞穴
      if(b===B.STONE){                                             // 矿石分布
        const o=vnoise3(x*0.23+51.7, y*0.23, z*0.23);
        if(y<12 && o>0.86) b=B.DIAMOND_ORE;
        else if(y<18 && o>0.84) b=B.GOLD_ORE;
        else if(y<30 && o>0.82) b=B.IRON_ORE;
        else if(y<40 && o>0.80) b=B.COAL_ORE;
      }
      if(b) d[lx+CH*(lz+CH*y)]=b;
    }
  }
  for(let ax=cx-1;ax<=cx+1;ax++) for(let az=cz-1;az<=cz+1;az++)
    for(const t of treesForChunk(ax,az)) stampTree(d,cx,cz,t);
  // 野花
  const forest = fbm(cx*0.9+500, cz*0.9) > 0.5;
  const fr = mulberry32(Math.floor(hash2(cx*5+101, cz*11+7)*4294967296));
  for(let i=0,n=forest?5:2;i<n;i++){
    const lx=(fr()*16)|0, lz=(fr()*16)|0;
    const x=cx*CH+lx, z=cz*CH+lz, h=heightAt(x,z);
    if(h<=WL+1 || h+1>=H || x>=50000) continue;
    if(d[lx+CH*(lz+CH*h)]===B.GRASS && d[lx+CH*(lz+CH*(h+1))]===0)
      d[lx+CH*(lz+CH*(h+1))]=B.ROSE;
  }
  // 洞穴宝箱
  const cr = mulberry32(Math.floor(hash2(cx*7+303, cz*13+77)*4294967296));
  if(cr()<0.7){
    for(let k=0;k<4;k++){
      const lx=(cr()*16)|0, lz=(cr()*16)|0, y=6+((cr()*22)|0);
      const i=lx+CH*(lz+CH*y), ib=lx+CH*(lz+CH*(y-1));
      if(y<H-2 && d[i]===0 && d[ib]!==0 && d[ib]!==B.WATER && d[ib]!==B.LAVA){ d[i]=B.CHEST; break; }
    }
  }
  // 村庄
  for(let rvx=Math.floor((cx*CH-8)/48); rvx<=Math.floor((cx*CH+CH+8)/48); rvx++)
    for(let rvz=Math.floor((cz*CH-8)/48); rvz<=Math.floor((cz*CH+CH+8)/48); rvz++){
      const vc=villageAt(rvx,rvz);
      if(vc) for(const hh of vc.houses) stampHouse(d,cx,cz,hh.x,hh.z);
    }
  const em=EDITS.get(ckey(cx,cz));
  if(em) for(const [i,b] of em) d[i]=b;
  // 登记光源/压力板/门(含村庄火把、重载的玩家方块)
  for(let i=0;i<d.length;i++){
    const b=d[i];
    if(b===B.TORCH||b===B.CAMPFIRE||b===B.PLATE||b===B.DOOR){
      const lx=i&15, lz=(i>>4)&15, y=i>>8;
      const key=(cx*CH+lx)+","+y+","+(cz*CH+lz);
      if(b===B.TORCH) torchSet.add(key);
      else if(b===B.CAMPFIRE) fireSet.add(key);
      else if(b===B.PLATE) plateSet.add(key);
      else doorSet.add(key);
    }
  }
  return d;
}
function villageAt(vx,vz){
  const r=mulberry32(Math.floor(hash2(vx*17+5, vz*29+11)*4294967296));
  if(r()>0.22) return null;
  const x=vx*48+24, z=vz*48+24;
  if(x>=50000 || heightAt(x,z)<=WL+2) return null;
  const offs=[[-7,0],[7,2],[0,-8],[6,-6]];
  const n=2+(r()<0.5?1:0), houses=[];
  for(let i=0;i<n;i++) houses.push({x:x+offs[i][0], z:z+offs[i][1]});
  return {x,z,houses};
}
function stampHouse(d,cx,cz,hx,hz){
  const h=heightAt(hx,hz);
  for(let dx=0;dx<5;dx++) for(let dz=0;dz<5;dz++){
    const corner=(dx===0||dx===4)&&(dz===0||dz===4);
    const edge=dx===0||dx===4||dz===0||dz===4;
    for(let y=h+1;y<=h+4;y++){
      let b=0;
      if(y===h+4) b=B.PLANK;
      else if(edge){
        if(dz===0&&dx===2&&y<=h+2){ putLocal(d,cx,cz,hx+dx-2,y,hz+dz-2,0,false); continue; }
        b=corner?B.LOG:B.PLANK;
      }
      if(b) putLocal(d,cx,cz,hx+dx-2,y,hz+dz-2,b,false);
    }
  }
  putLocal(d,cx,cz,hx,h+2,hz,B.TORCH,false);
}
function treesForChunk(cx,cz){
  const r=mulberry32(Math.floor(hash2(cx*3+11, cz*7+5)*4294967296));
  const forest = fbm(cx*0.9+500, cz*0.9) > 0.5;
  const n = forest ? 2+Math.floor(r()*4) : (r()<0.35?1:0);
  const list=[];
  for(let i=0;i<n;i++){
    const lx=2+Math.floor(r()*12), lz=2+Math.floor(r()*12);
    const x=cx*CH+lx, z=cz*CH+lz, h=heightAt(x,z);
    if(x>=50000 || h<=WL+1) continue;
    const th=4+Math.floor(r()*2);
    if(h+th+2>=H) continue;
    list.push({x,z,h,th});
  }
  return list;
}
function putLocal(d,cx,cz,x,y,z,b,onlyAir){
  const lx=x-cx*CH, lz=z-cz*CH;
  if(lx<0||lx>=CH||lz<0||lz>=CH||y<0||y>=H) return;
  const i=lx+CH*(lz+CH*y);
  if(onlyAir && d[i]!==0) return;
  d[i]=b;
}
function stampTree(d,cx,cz,t){
  for(let y=1;y<=t.th;y++) putLocal(d,cx,cz,t.x,t.h+y,t.z,B.LOG,false);
  for(let dy=t.th-1;dy<=t.th+1;dy++) for(let dx=-2;dx<=2;dx++) for(let dz=-2;dz<=2;dz++){
    const r=Math.abs(dx)+Math.abs(dz)+(dy===t.th+1?1:0);
    if(r<=3 && hash2(t.x+dx*7+dy, t.z+dz*3+dy)>0.12)
      putLocal(d,cx,cz,t.x+dx,t.h+dy,t.z+dz,B.LEAF,true);
  }
}

// ---------- 体素访问 ----------
function getV(x,y,z){
  if(y<0||y>=H) return 0;
  const c=chunksData.get(ckey(x>>4,z>>4));
  if(!c) return 0;
  return c.d[(x&15)+CH*((z&15)+CH*y)];
}
function setV(x,y,z,b){
  if(y<0||y>=H) return;
  const k=ckey(x>>4,z>>4), i=(x&15)+CH*((z&15)+CH*y);
  const c=chunksData.get(k);
  if(c) c.d[i]=b;
  let em=EDITS.get(k);
  if(!em){ em=new Map(); EDITS.set(k,em); }
  em.set(i,b);
  if(b===B.TORCH) torchSet.add(x+","+y+","+z); else torchSet.delete(x+","+y+","+z);
  if(b===B.CAMPFIRE) fireSet.add(x+","+y+","+z); else fireSet.delete(x+","+y+","+z);
  if(b===B.PLATE) plateSet.add(x+","+y+","+z); else plateSet.delete(x+","+y+","+z);
  if(b===B.DOOR) doorSet.add(x+","+y+","+z); else doorSet.delete(x+","+y+","+z);
}
function solid(x,y,z){
  if(y<0) return true;
  if(y>=H) return false;
  const c=chunksData.get(ckey(x>>4,z>>4));
  if(!c) return true;
  const b=c.d[(x&15)+CH*((z&15)+CH*y)];
  if(b===B.DOOR) return (doorOpen.get(x+","+y+","+z)||0) < performance.now();
  return b!==0 && b!==B.WATER && b!==B.ROSE && b!==B.TORCH && b!==B.PLATE && b!==B.LAVA;
}

let AC=null, master=null, noiseBuf=null, rainGain=null;
function ensureAudio(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.6; master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const chd=noiseBuf.getChannelData(0);
    for(let i=0;i<chd.length;i++) chd[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=240;
    const g=AC.createGain(); g.gain.value=0.035;
    const lfo=AC.createOscillator(); lfo.frequency.value=0.09;
    const lg=AC.createGain(); lg.gain.value=0.02;
    lfo.connect(lg); lg.connect(g.gain);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(); lfo.start();
    // 雨声通道(平时静音)
    const rsrc=AC.createBufferSource(); rsrc.buffer=noiseBuf; rsrc.loop=true;
    const rf=AC.createBiquadFilter(); rf.type="bandpass"; rf.frequency.value=2600;
    rainGain=AC.createGain(); rainGain.gain.value=0;

}

function tileFor(b, ny){

// 交叉面(花/火把):写入双面quad
function pushCross(g, x, y, z, hw, hh, t){
  const e=0.02, u0=(t+e)/TILES, u1=(t+1-e)/TILES, v0=e, v1=1-e;
  const quads=[
    [[x+0.5-hw,y,z+0.5-hw],[x+0.5+hw,y,z+0.5+hw]],
    [[x+0.5+hw,y,z+0.5-hw],[x+0.5-hw,y,z+0.5+hw]],
  ];
  for(const [a,bp] of quads){
    const ndx=g.pos.length/3;
    g.pos.push(a[0],a[1],a[2], bp[0],bp[1],bp[2], a[0],a[1]+hh,a[2], bp[0],bp[1]+hh,bp[2]);
    for(let q=0;q<4;q++) g.nor.push(0,1,0);
    g.uv.push(u0,v0, u1,v0, u0,v1, u1,v1);
    g.ind.push(ndx,ndx+1,ndx+2, ndx+2,ndx+1,ndx+3,  ndx+2,ndx+1,ndx, ndx+3,ndx+1,ndx+2);

function buildChunk(cx,cz){

  for(let lx=0;lx<CH;lx++) for(let lz=0;lz<CH;lz++){
    const x=cx*CH+lx, z=cz*CH+lz;
    for(let y=0;y<H;y++){

      if(b===B.DOOR && doorOpen.has(x+","+y+","+z)) continue;   // 开着的门不渲染
      if(b===B.ROSE || b===B.TORCH){
        pushCross(op, x, y, z, b===B.ROSE?0.42:0.26, b===B.ROSE?0.85:0.62, tileFor(b,0));
        continue;
      }
      if(b===B.PLATE){                                          // 压力板(薄板)
        const e=0.04, t=24;
        for(const f of FACES){
          if(f.dir[1]===-1) continue;

          for(const c of f.corners){
            op.pos.push(x+c[0], y+c[1]*0.12, z+c[2]);
            op.nor.push(f.dir[0], f.dir[1], f.dir[2]);
            op.uv.push((t+(c[3]*(1-2*e)+e))/TILES, c[4]*(1-2*e)+e);
          }
          op.ind.push(ndx,ndx+1,ndx+2, ndx+2,ndx+1,ndx+3);
        }
        continue;
      }
      const water=b===B.WATER||b===B.LAVA, glass=b===B.GLASS;
      for(const f of FACES){
        const nb=getV(x+f.dir[0], y+f.dir[1], z+f.dir[2]);
        let topH=1;
        if(water){
          if(f.dir[1]===-1) continue;
          if(nb!==0 && nb!==B.GLASS && nb!==B.ROSE && nb!==B.TORCH && nb!==B.PLATE) continue;
          topH = (getV(x,y+1,z)===B.WATER||getV(x,y+1,z)===B.LAVA) ? 1 : 0.86;
        } else if(glass){

          if(water) g.uv.push(c[3], c[4]*topH);
          else g.uv.push((t+(c[3]*(1-2*e)+e))/TILES, c[4]*(1-2*e)+e);
        }

function rebuildAt(x,z){

function ensureChunks(){
  const pcx=Math.floor(player.pos.x/CH), pcz=Math.floor(player.pos.z/CH);
  for(const [k,e] of chunkMeshes)
    if(Math.max(Math.abs(e.cx-pcx),Math.abs(e.cz-pcz))>CHUNK_R+1) disposeChunk(k);
  for(const [k,e] of chunksData)
    if(Math.max(Math.abs(e.cx-pcx),Math.abs(e.cz-pcz))>CHUNK_R+2) chunksData.delete(k);
  const needD=[], needM=[];
  for(let dx=-CHUNK_R-1;dx<=CHUNK_R+1;dx++) for(let dz=-CHUNK_R-1;dz<=CHUNK_R+1;dz++){
    const cx=pcx+dx, cz=pcz+dz, k=ckey(cx,cz);
    const dist=Math.max(Math.abs(dx),Math.abs(dz));
    if(!chunksData.has(k)) needD.push({cx,cz,dist});
    else if(dist<=CHUNK_R && !chunkMeshes.has(k)
      && chunksData.has(ckey(cx+1,cz)) && chunksData.has(ckey(cx-1,cz))
      && chunksData.has(ckey(cx,cz+1)) && chunksData.has(ckey(cx,cz-1)))
      needM.push({cx,cz,dist});
  }
  needD.sort((a,b)=>a.dist-b.dist); needM.sort((a,b)=>a.dist-b.dist);
  for(let i=0;i<Math.min(2,needD.length);i++){ const c=needD[i];
    chunksData.set(ckey(c.cx,c.cz), {cx:c.cx, cz:c.cz, d:genChunkData(c.cx,c.cz)}); }

const player = { pos:new THREE.Vector3(), vel:new THREE.Vector3(), yaw:0, pitch:0, onGround:false };
const spawnPoint = new THREE.Vector3();
// 从 (cx,cz) 向外螺旋搜索 h>WL+2 的陆地;找不到则返回最高点
function findLand(cx,cz,maxR){
  let best=null, bestH=-99;
  for(let r=0;r<maxR;r+=4){
    for(let a=0;a<16;a++){
      const x=Math.round(cx+Math.cos(a*0.3927)*r), z=Math.round(cz+Math.sin(a*0.3927)*r);
      const h=heightAt(x,z);
      if(h>WL+2) return {x,z,h};
      if(h>bestH){ bestH=h; best={x,z,h}; }
    }
  }
  return best;
}
function spawn(){
  const s=findLand(0,0,600) || {x:0,z:0,h:heightAt(0,0)};
  player.pos.set(s.x+0.5, Math.max(s.h,WL)+1.01, s.z+0.5);
  player.vel.set(0,0,0);
  player.yaw = Math.PI*0.25;
  spawnPoint.copy(player.pos);
}
function aabbCollides(){
  const p=player.pos;
  const x0=Math.floor(p.x-PR), x1=Math.floor(p.x+PR);
  const y0=Math.floor(p.y),    y1=Math.floor(p.y+PH);
  const z0=Math.floor(p.z-PR), z1=Math.floor(p.z+PR);
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) for(let z=z0;z<=z1;z++)
    if(solid(x,y,z)) return true;
  return false;
}
function moveAxis(axis, amt){
  if(!amt) return;
  const p=player.pos;
  p[axis]+=amt;
  if(!aabbCollides()) return;
  if(axis==="x"){ p.x = amt>0 ? Math.floor(p.x+PR)-PR-0.001 : Math.floor(p.x-PR)+1+PR+0.001; player.vel.x=0; }
  if(axis==="z"){ p.z = amt>0 ? Math.floor(p.z+PR)-PR-0.001 : Math.floor(p.z-PR)+1+PR+0.001; player.vel.z=0; }
  if(axis==="y"){
    if(amt>0){ p.y = Math.floor(p.y+PH)-PH-0.001; }
    else { p.y = Math.floor(p.y)+1; player.onGround=true; }
    player.vel.y=0;
  }
}

// ---------- DDA 射线(方块) ----------
function raycastVoxel(){
  const dir = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  let x=Math.floor(camera.position.x), y=Math.floor(camera.position.y), z=Math.floor(camera.position.z);
  const stx=Math.sign(dir.x), sty=Math.sign(dir.y), stz=Math.sign(dir.z);
  const tdx=Math.abs(1/dir.x), tdy=Math.abs(1/dir.y), tdz=Math.abs(1/dir.z);
  let tmx = stx!==0 ? tdx*(stx>0 ? x+1-camera.position.x : camera.position.x-x) : Infinity;
  let tmy = sty!==0 ? tdy*(sty>0 ? y+1-camera.position.y : camera.position.y-y) : Infinity;
  let tmz = stz!==0 ? tdz*(stz>0 ? z+1-camera.position.z : camera.position.z-z) : Infinity;
  let nx=0,ny=0,nz=0, t=0;
  for(let i=0;i<128;i++){
    if(tmx<tmy && tmx<tmz){ x+=stx; t=tmx; tmx+=tdx; nx=-stx;ny=0;nz=0; }
    else if(tmy<tmz){ y+=sty; t=tmy; tmy+=tdy; nx=0;ny=-sty;nz=0; }
    else { z+=stz; t=tmz; tmz+=tdz; nx=0;ny=0;nz=-stz; }
    if(t>REACH) return null;
    const b=getV(x,y,z);
    if(b!==0 && b!==B.WATER && b!==B.LAVA) return {x,y,z,nx,ny,nz,b,t};
  }
  return null;
}
// 射线(生物)
function raycastMob(){
  const dir = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  let best=null, bestT=REACH;
  for(const m of mobs){
    const vx=m.pos.x-camera.position.x, vy=m.pos.y+0.7-camera.position.y, vz=m.pos.z-camera.position.z;
    const t=vx*dir.x+vy*dir.y+vz*dir.z;
    if(t<0.3 || t>bestT) continue;
    const qx=vx-dir.x*t, qy=vy-dir.y*t, qz=vz-dir.z*t;
    if(qx*qx+qy*qy+qz*qz<0.72){ best=m; bestT=t; }
  }
  return best?{m:best,t:bestT}:null;
}

function attack(){

function doPlace(){
  const hit=raycastVoxel(); if(!hit) return;
  if(hit.b===B.CRAFT_TABLE){ toggleCraft(true); return; }   // 点合成台打开面板
  if(hit.b===B.BED){ trySleep(hit); return; }               // 点床睡觉
  if(hit.b===B.PORTAL){ usePortal(); return; }              // 点地狱门传送
  const x=hit.x+hit.nx, y=hit.y+hit.ny, z=hit.z+hit.nz;
  const cur=getV(x,y,z);
  if((cur!==0 && cur!==B.WATER && cur!==B.ROSE) || y<=0) return;
  const b=HOTBAR[selBlock];
  if((b===B.ROSE||b===B.TORCH||b===B.PLATE||b===B.DOOR) && !solid(x,y-1,z)) return;   // 需要支撑
  const p=player.pos;
  if(b!==B.ROSE && b!==B.TORCH && b!==B.PLATE && b!==B.DOOR && x+1>p.x-PR && x<p.x+PR && z+1>p.z-PR && z<p.z+PR && y+1>p.y && y<p.y+PH) return;
  if(!invTake(b)) return;

function damageMob(t,dmg,dx,dz){
  t.hp-=dmg;
  const l=Math.hypot(dx,dz)||1;
  t.kx+=dx/l*6; t.kz+=dz/l*6; t.vel.y=4.2;
  t.mesh.traverse(o=>{ if(o.material&&o.material.emissive) o.material.emissive.setHex(0x992222); });
  setTimeout(()=>t.mesh.traverse(o=>{ if(o.material&&o.material.emissive) o.material.emissive.setHex(0); }),150);
  const sf=MOB_SFX[t.def.sfx]; if(sf) sf(1);
  if(t.hp<=0){
    spawnParticles(t.pos.x, t.pos.y+0.7, t.pos.z, t.def.color, 16);
    if(t.def.drop && !t.baby) for(let k=0;k<t.def.dropN;k++) spawnDrop(t.def.drop, t.pos.x, t.pos.y+0.5, t.pos.z);
    if(t.type==="zombie") ach("hunter","⚔️ 猎魔人");
    killMob(t); mobs.splice(mobs.indexOf(t),1);
    return true;
  }
  if(!t.def.hostile){
    if(t.type==="wolf" && !t.tamed) t.angry=12;    // 野狼被激怒
    else t.flee=4;
  }
  return false;
}
function hitMob(m){
  const dx=m.pos.x-player.pos.x, dz=m.pos.z-player.pos.z;
  burst(0.1,500,0.3);
  damageMob(m,1,dx,dz);
  for(const w of mobs) if(w.type==="wolf"&&w.tamed) w.atk=m;   // 驯服的狼集火目标
}

const tnts=[];
function igniteTNT(x,y,z,fuse){
  setV(x,y,z,0); rebuildAt(x,z);
  const mesh=new THREE.Mesh(blockGeo(B.TNT), worldMat);
  mesh.scale.setScalar(0.95);
  mesh.position.set(x+0.5,y+0.5,z+0.5);
  scene.add(mesh);
  tnts.push({pos:new THREE.Vector3(x+0.5,y+0.5,z+0.5), vel:new THREE.Vector3(0,2.5,0), fuse, mesh, hissT:0});
}
function updateTnts(dt){
  for(let i=tnts.length-1;i>=0;i--){
    const t=tnts[i];
    t.fuse-=dt;
    t.mesh.visible=Math.floor(t.fuse*8)%2===0;         // 闪烁
    t.hissT-=dt;
    if(t.hissT<=0){ t.hissT=0.18; burst(0.08,4200,0.16,"highpass"); }
    t.vel.y-=20*dt;
    let ny=t.pos.y+t.vel.y*dt;
    if(t.vel.y<0 && solid(Math.floor(t.pos.x),Math.floor(ny-0.45),Math.floor(t.pos.z))){
      ny=Math.floor(ny-0.45)+1+0.45; t.vel.y=0;
    }
    t.pos.y=ny;
    t.mesh.position.copy(t.pos);
    if(t.fuse<=0){
      scene.remove(t.mesh); t.mesh.geometry.dispose();
      tnts.splice(i,1);
      explode(t.pos);
    }
  }
}
function rebuildChunksAround(set){
  const all=new Set();
  for(const k of set){
    const p=k.split(","), cx=+p[0], cz=+p[1];
    all.add(k); all.add(ckey(cx+1,cz)); all.add(ckey(cx-1,cz)); all.add(ckey(cx,cz+1)); all.add(ckey(cx,cz-1));
  }
  for(const k of all) if(chunkMeshes.has(k)){ const p=k.split(","); buildChunk(+p[0],+p[1]); }
}
function explode(pos){
  const R=4.2;
  burst(0.7,140,0.9); tone(80,28,0.65,0.7,"triangle");
  setTimeout(()=>burst(0.4,300,0.4),80);
  shake=Math.max(shake,0.8);
  const bx=Math.floor(pos.x), by=Math.floor(pos.y), bz=Math.floor(pos.z);
  const changed=new Set();
  for(let x=bx-5;x<=bx+5;x++) for(let y=by-5;y<=by+5;y++) for(let z=bz-5;z<=bz+5;z++){
    const dx=x+0.5-pos.x, dy=y+0.5-pos.y, dz=z+0.5-pos.z;
    const r=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(r>R || y<=0) continue;
    const b=getV(x,y,z);
    if(!b || b===B.WATER) continue;
    const p=r<3?1:1-(r-3)/(R-3);
    if(Math.random()<p){
      if(b===B.TNT){ igniteTNT(x,y,z,0.2+Math.random()*0.5); continue; }  // 连锁
      setV(x,y,z,0);
      changed.add(ckey(x>>4,z>>4));
      const db=DROP_MAP[b];
      if(db && Math.random()<0.3) spawnDrop(db,x+0.5,y+0.5,z+0.5);
    }
  }
  rebuildChunksAround(changed);
  ach("boom","💥 爆破专家");
  spawnParticles(pos.x,pos.y,pos.z,0x777777,22);
  spawnParticles(pos.x,pos.y,pos.z,0xff8020,14);
  // 玩家伤害+击飞
  const pdx=player.pos.x-pos.x, pdy=player.pos.y+0.9-pos.y, pdz=player.pos.z-pos.z;
  const pd=Math.sqrt(pdx*pdx+pdy*pdy+pdz*pdz);
  if(pd<7){
    hurt(Math.ceil((7-pd)*3));
    player.vel.x+=pdx/pd*(7-pd)*1.6; player.vel.z+=pdz/pd*(7-pd)*1.6; player.vel.y+=(7-pd)*0.9;
  }
  // 生物伤害
  for(let i=mobs.length-1;i>=0;i--){
    const m=mobs[i];
    const mdx=m.pos.x-pos.x, mdz=m.pos.z-pos.z;
    const md=Math.sqrt(mdx*mdx+mdz*mdz);
    if(md<7) damageMob(m,Math.ceil((7-md)*2),mdx,mdz);
  }
}

  let best=null, bestT=5;
  for(const b of boats){
    const vx=b.pos.x-camera.position.x, vy=b.pos.y+0.3-camera.position.y, vz=b.pos.z-camera.position.z;
    const t=vx*dir.x+vy*dir.y+vz*dir.z;
    if(t<0.5||t>bestT) continue;
    const qx=vx-dir.x*t, qy=vy-dir.y*t, qz=vz-dir.z*t;
    if(qx*qx+qy*qy+qz*qz<1.2){ best=b; bestT=t; }
  }
  return best?{b:best,t:bestT}:null;
}
function updateBoats(dt){
  for(let i=boats.length-1;i>=0;i--){
    const b=boats[i];
    if(b!==riding){ b.vel.x*=Math.exp(-2*dt); b.vel.z*=Math.exp(-2*dt); }
    const fx=Math.floor(b.pos.x), fz=Math.floor(b.pos.z);
    let sy=-1;
    for(let y=Math.floor(b.pos.y)+2;y>=Math.floor(b.pos.y)-2;y--)
      if(getV(fx,y,fz)===B.WATER){ sy=y; break; }
    if(sy>=0){ b.pos.y+=(sy+0.75-b.pos.y)*Math.min(1,dt*5); b.vel.y=0; }
    else b.vel.y+=GRAV*dt;
    b.blocked=false; b.onGround=false;
    mobAxis(b,"x",b.vel.x*dt); mobAxis(b,"z",b.vel.z*dt); mobAxis(b,"y",b.vel.y*dt);
    b.mesh.position.copy(b.pos);
    b.mesh.rotation.y=b.yaw;
    const d2=(b.pos.x-player.pos.x)**2+(b.pos.z-player.pos.z)**2;
    if(d2>96*96){ scene.remove(b.mesh); boats.splice(i,1); if(riding===b) riding=null; }
  }
}

  chk(Math.floor(player.pos.x),Math.floor(player.pos.y),Math.floor(player.pos.z));

    for(let dx=-3;dx<=3;dx++) for(let dy=-2;dy<=2;dy++) for(let dz=-3;dz<=3;dz++){
      const k=(x+dx)+","+(y+dy)+","+(z+dz);
      if(doorSet.has(k)) want.add(k);

  }
}

// ---------- 第一人称手部模型 ----------
function blockGeo(b){
  const pos=[],nor=[],uv=[],ind=[], e=0.04;
  if(b===B.ROSE || b===B.TORCH){
    const t=tileFor(b,0), ee=0.02, u0=(t+ee)/TILES, u1=(t+1-ee)/TILES, v0=ee, v1=1-ee;
    const quads=[[[-0.5,-0.5,-0.5],[0.5,-0.5,0.5]],[[0.5,-0.5,-0.5],[-0.5,-0.5,0.5]]];
    for(const [a,bp] of quads){
      const ndx=pos.length/3;
      pos.push(a[0],a[1],a[2], bp[0],bp[1],bp[2], a[0],a[1]+1,a[2], bp[0],bp[1]+1,bp[2]);
      for(let q=0;q<4;q++) nor.push(0,1,0);
      uv.push(u0,v0, u1,v0, u0,v1, u1,v1);
      ind.push(ndx,ndx+1,ndx+2, ndx+2,ndx+1,ndx+3,  ndx+2,ndx+1,ndx, ndx+3,ndx+1,ndx+2);
    }
  } else {
    for(const f of FACES){
      const t=tileFor(b,f.dir[1]), ndx=pos.length/3;
      for(const c of f.corners){
        pos.push(c[0]-0.5, c[1]-0.5, c[2]-0.5);
        nor.push(f.dir[0], f.dir[1], f.dir[2]);
        uv.push((t+(c[3]*(1-2*e)+e))/TILES, c[4]*(1-2*e)+e);
      }
      ind.push(ndx,ndx+1,ndx+2, ndx+2,ndx+1,ndx+3);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("normal",   new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute("uv",       new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(ind);
  return g;
}

  if(e.code==="Space") e.preventDefault();
  if(e.code==="KeyE") toggleCraft();
  if(e.code==="KeyF") feedTarget();
  if(e.code==="KeyR") toggleRide();
  if(e.code==="KeyQ") shootArrow();
  if(e.code==="KeyG") throwEgg();
  if(e.code==="KeyT") castFish();
  if(e.code==="KeyB") spawnBoat();
  if(e.code==="KeyV") tradeTarget();
  if(e.code==="KeyW" && !e.repeat){ const t=performance.now(); if(t-wTapT<280) dblSprint=true; wTapT=t; }
  if(/^Digit[0-9]$/.test(e.code)){ const n=+e.code.slice(5); selectSlot(n===0?9:n-1); }
});
addEventListener("keyup",e=>{ keys[e.code]=false; if(e.code==="KeyW") dblSprint=false; });
canvas.addEventListener("mousedown",e=>{
  if(!document.pointerLockElement){ canvas.requestPointerLock(); return; }
  if(e.button===0) { mouseBreak=true; attack(); }
  if(e.button===2) doPlace();
});
addEventListener("mouseup",e=>{ if(e.button===0) mouseBreak=false; });
addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("mousemove",e=>{
  if(document.pointerLockElement!==canvas) return;
  player.yaw   -= e.movementX*0.0026;
  player.pitch -= e.movementY*0.0026;
  player.pitch = Math.max(-1.55, Math.min(1.55, player.pitch));
});

const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints>0;
if(isTouch) document.body.classList.add("touch");
const joy={ id:null, ox:0, oy:0, x:0, y:0 };
let lookTouch={ id:null, lx:0, ly:0 };
let btnJumpHeld=false, btnBreakHeld=false;
const joyBase=document.getElementById("joyBase"), joyKnob=document.getElementById("joyKnob");

function bindBtn(el, down, up){
  el.addEventListener("touchstart",e=>{ e.preventDefault(); e.stopPropagation(); down(); },{passive:false});
  el.addEventListener("touchend",  e=>{ e.preventDefault(); if(up)up(); },{passive:false});
  el.addEventListener("touchcancel",()=>{ if(up)up(); });
  el.addEventListener("mousedown", e=>{ e.stopPropagation(); down(); });
  el.addEventListener("mouseup",   ()=>{ if(up)up(); });
}
bindBtn(document.getElementById("btnJump"), ()=>btnJumpHeld=true, ()=>btnJumpHeld=false);
bindBtn(document.getElementById("btnBreak"),()=>{ btnBreakHeld=true; attack(); }, ()=>btnBreakHeld=false);
bindBtn(document.getElementById("btnPlace"),()=>doPlace());

canvas.addEventListener("touchstart",e=>{
  e.preventDefault(); hideHint();
  for(const t of e.changedTouches){
    if(t.clientX < innerWidth*0.45 && joy.id===null){
      joy.id=t.identifier; joy.ox=t.clientX; joy.oy=t.clientY; joy.x=0; joy.y=0;
      joyBase.style.display="block";
      joyBase.style.left=t.clientX+"px"; joyBase.style.top=t.clientY+"px";
    } else if(lookTouch.id===null){
      lookTouch={id:t.identifier, lx:t.clientX, ly:t.clientY};
    }
  }
},{passive:false});
canvas.addEventListener("touchmove",e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){
      let dx=t.clientX-joy.ox, dy=t.clientY-joy.oy;
      const len=Math.hypot(dx,dy), max=48;
      if(len>max){ dx=dx/len*max; dy=dy/len*max; }
      joy.x=dx/max; joy.y=dy/max;
      joyKnob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    } else if(t.identifier===lookTouch.id){
      player.yaw   -= (t.clientX-lookTouch.lx)*0.005;
      player.pitch -= (t.clientY-lookTouch.ly)*0.005;
      player.pitch = Math.max(-1.55, Math.min(1.55, player.pitch));
      lookTouch.lx=t.clientX; lookTouch.ly=t.clientY;
    }
  }
},{passive:false});
function touchEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){ joy.id=null; joy.x=0; joy.y=0; joyBase.style.display="none";
      joyKnob.style.transform="translate(-50%,-50%)"; }
    if(t.identifier===lookTouch.id) lookTouch.id=null;
  }
}
canvas.addEventListener("touchend",touchEnd);
canvas.addEventListener("touchcancel",touchEnd);

const btnFull=document.getElementById("btnFull");
function toggleFull(){
  const el=document.documentElement;
  if(document.fullscreenElement||document.webkitFullscreenElement){
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  } else {
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(req) req.call(el);
  }
}

const hotbarEl=document.getElementById("hotbar");
function tileIcon(block){
  const c=document.createElement("canvas"); c.width=c.height=32;
  const g=c.getContext("2d");
  const t = tileFor(block, block===B.GRASS?1:0);
  g.imageSmoothingEnabled=true;
  g.drawImage(atlasCvs, t*TILE,0,TILE,TILE, 0,0,32,32);
  if(block===B.GRASS){ g.drawImage(atlasCvs,1*TILE,0,TILE,TILE,0,14,32,18); }
  return c;
}
HOTBAR.forEach((b,i)=>{
  const s=document.createElement("div"); s.className="slot";
  s.appendChild(tileIcon(b));
  const cnt=document.createElement("span"); cnt.className="cnt";
  s.appendChild(cnt);
  s.addEventListener("pointerdown",e=>{ e.stopPropagation(); selectSlot(i); });
  hotbarEl.appendChild(s);
});
function selectSlot(i){
  selBlock=i;
  [...hotbarEl.children].forEach((s,j)=>s.classList.toggle("sel",j===i));
  updateHandBlock();
}
function updateInvUI(){
  [...hotbarEl.children].forEach((s,j)=>{
    const c=inv[HOTBAR[j]]||0;
    s.querySelector(".cnt").textContent=c;
    s.style.opacity=c>0?1:0.45;
  });
  if(craftOpen) renderCraft();
}
selectSlot(0);
updateInvUI();

    const nose=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.16,0.1), mat(0xc99050));
    nose.position.set(0,1.38,0.28); g.add(nose);
    const arms=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.16,0.16), mat(0x8a6a4a));
    arms.position.set(0,0.95,0.22); g.add(arms);
    const legGeo=new THREE.BoxGeometry(0.15,0.3,0.15); legGeo.translate(0,-0.15,0);
    mkLegs(legGeo,[[-0.12,0],[0.12,0]],0x5a4a34,0.3);
  } else { // zombie
    const body=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.68,0.28), mat(0x2a8a8a));
    body.position.y=1.0; g.add(body);
    const head=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.36,0.36), mat(0x5a9a4a));
    head.position.y=1.56; g.add(head);
    for(const ax of [-0.33,0.33]){
      const arm=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.5,0.13), mat(0x5a9a4a));
      arm.geometry.translate(0,-0.2,0);
      arm.position.set(ax,1.28,0.28); arm.rotation.x=-1.5; g.add(arm);
    }
    const legGeo=new THREE.BoxGeometry(0.17,0.62,0.17); legGeo.translate(0,-0.31,0);
    mkLegs(legGeo,[[-0.13,0],[0.13,0]], 0x3a4a8a, 0.66);
  }
  scene.add(g);
  return { type, def:D, pos:new THREE.Vector3(), vel:new THREE.Vector3(),
    yaw:Math.random()*6.283, tYaw:0, timer:0, walking:false,
    mesh:g, legs, wings, tail:tailP, phase:0, phase2:0, soundT:5+Math.random()*10, onGround:false, blocked:false,
    hp:D.hp, flee:0, kx:0, kz:0, half:D.half, hgt:D.hgt, burn:0, atkT:0,
    love:0, breedCd:0, baby:false, age:0, angry:0, tamed:false, atk:null, vyT:0 };
}
function addCollar(m){
  if(m.collar) return;
  m.collar=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.08,0.36), new THREE.MeshLambertMaterial({color:0xd02020}));
  m.collar.position.set(0,0.7,0.38);
  m.mesh.add(m.collar);
}
function addSaddle(m){
  if(m.saddle) return;
  m.saddle=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.12,0.55), new THREE.MeshLambertMaterial({color:0x8a2020}));
  m.saddle.position.set(0,1.48,0);
  m.mesh.add(m.saddle);
}
function killMob(m){
  m.mesh.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); });
  scene.remove(m.mesh);
}
function boxCollides(px,py,pz,half,height){
  const x0=Math.floor(px-half), x1=Math.floor(px+half);
  const y0=Math.floor(py),       y1=Math.floor(py+height);
  const z0=Math.floor(pz-half),  z1=Math.floor(pz+half);
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) for(let z=z0;z<=z1;z++)
    if(solid(x,y,z)) return true;
  return false;
}
function mobAxis(m,axis,amt){
  if(!amt) return;
  const p=m.pos, hf=m.half, hg=m.hgt;
  p[axis]+=amt;
  if(!boxCollides(p.x,p.y,p.z,hf,hg)) return;
  if(axis==="x"){ p.x=amt>0?Math.floor(p.x+hf)-hf-0.001:Math.floor(p.x-hf)+1+hf+0.001; m.vel.x=0; m.blocked=true; }
  if(axis==="z"){ p.z=amt>0?Math.floor(p.z+hf)-hf-0.001:Math.floor(p.z-hf)+1+hf+0.001; m.vel.z=0; m.blocked=true; }
  if(axis==="y"){
    if(amt>0){ p.y=Math.floor(p.y+hg)-hg-0.001; }
    else { p.y=Math.floor(p.y)+1; m.onGround=true; }
    m.vel.y=0;
  }
}
function trySpawnMob(type,dmin,dmax){
  const a=Math.random()*6.283, d=dmin+Math.random()*(dmax-dmin);
  const x=Math.floor(player.pos.x+Math.cos(a)*d), z=Math.floor(player.pos.z+Math.sin(a)*d);
  if(!chunksData.has(ckey(x>>4,z>>4))) return;
  for(let y=H-10;y>WL;y--){
    if(getV(x,y,z)===B.GRASS && getV(x,y+1,z)===0 && getV(x,y+2,z)===0){
      const m=makeMob(type);
      m.pos.set(x+0.5,y+1.01,z+0.5); m.tYaw=m.yaw;
      mobs.push(m); return;
    }
  }
}
function trySpawnFish(){
  for(let t=0;t<10;t++){                            // 多次尝试找水柱
    const a=Math.random()*6.283, d=14+Math.random()*26;
    const x=Math.floor(player.pos.x+Math.cos(a)*d), z=Math.floor(player.pos.z+Math.sin(a)*d);
    if(!chunksData.has(ckey(x>>4,z>>4))) continue;
    for(let y=WL;y>WL-5;y--){
      if(getV(x,y,z)===B.WATER && getV(x,y-1,z)===B.WATER){
        const n=2+Math.floor(Math.random()*3);      // 鱼群 2~4 条
        for(let k=0;k<n;k++){
          const m=makeMob("fish");
          m.pos.set(x+0.5+(Math.random()-0.5)*2, y+0.3+(Math.random()-0.5), z+0.5+(Math.random()-0.5)*2);
          m.tYaw=m.yaw;
          mobs.push(m);
        }
        return;
      }
    }
  }
}
function trySpawnBat(){
  const a=Math.random()*6.283, d=16+Math.random()*16;
  const x=Math.floor(player.pos.x+Math.cos(a)*d), z=Math.floor(player.pos.z+Math.sin(a)*d);
  if(!chunksData.has(ckey(x>>4,z>>4))) return;
  const h=heightAt(x,z);
  for(let y=h-4;y>6;y--){
    if(getV(x,y,z)===0 && getV(x,y+1,z)===0 && getV(x,y-1,z)===0){
      for(let k=2;k<=6;k++){ if(isOpaqueB(getV(x,y+k,z))){
        const m=makeMob("bat");
        m.pos.set(x+0.5,y+0.5,z+0.5); m.tYaw=m.yaw;
        mobs.push(m); return;
      }}
    }
  }
}
function updateMobs(dt,dayF){
  // 被动生物生成(成群)
  mobSpawnT-=dt;
  if(mobSpawnT<=0){
    mobSpawnT=4;
    if(mobs.filter(m=>!m.def.hostile && !m.def.water && !m.def.fly).length<14){
      const r=Math.random();
      const type=r<0.18?"sheep":r<0.34?"pig":r<0.5?"chicken":r<0.62?"cow":r<0.78?"rabbit":r<0.9?"wolf":"horse";
      trySpawnMob(type, 24, 40);
      if(Math.random()<0.55){ trySpawnMob(type, 22, 40); trySpawnMob(type, 22, 40); }
    }
  }
  // 鱼/蝙蝠
  fishT-=dt;
  if(fishT<=0){ fishT=4; if(mobs.filter(m=>m.type==="fish").length<8) trySpawnFish(); }
  batT-=dt;
  if(batT<=0){ batT=8; if(mobs.filter(m=>m.type==="bat").length<3) trySpawnBat(); }
  // 敌对生物夜袭(僵尸+蜘蛛+骷髅)
  zSpawnT-=dt;
  if(zSpawnT<=0){
    zSpawnT=5;
    if(dayF<0.25){
      const zc=mobs.filter(m=>m.type==="zombie").length, sc=mobs.filter(m=>m.type==="spider").length;
      const skc=mobs.filter(m=>m.type==="skeleton").length;
      const r2=Math.random();
      if(r2<0.5){ if(zc<4) trySpawnMob("zombie", 20, 30); }
      else if(r2<0.75){ if(sc<2) trySpawnMob("spider", 18, 28); }
      else if(skc<2) trySpawnMob("skeleton", 20, 30);
    }
  }
  // 恶魂(仅下界)
  ghastT-=dt;
  if(ghastT<=0){
    ghastT=8;
    if(player.pos.x>=50000 && mobs.filter(m=>m.type==="ghast").length<2){
      const a=Math.random()*6.283, dd=15+Math.random()*12;
      const m=makeMob("ghast");
      m.pos.set(player.pos.x+Math.cos(a)*dd, player.pos.y+8, player.pos.z+Math.sin(a)*dd);
      m.tYaw=m.yaw; mobs.push(m);
    }
  }
  // 村民
  vilT-=dt;
  if(vilT<=0){
    vilT=8;
    const rvx=Math.floor(player.pos.x/48), rvz=Math.floor(player.pos.z/48);
    for(let ax=rvx-1;ax<=rvx+1;ax++) for(let az=rvz-1;az<=rvz+1;az++){
      const vc=villageAt(ax,az), vk=ax+","+az;
      if(vc && !spawnedVillages.has(vk) && (vc.x-player.pos.x)**2+(vc.z-player.pos.z)**2<3600){
        spawnedVillages.add(vk);
        for(let k=0;k<3;k++){
          const m=makeMob("villager");
          m.pos.set(vc.x+0.5+(Math.random()-0.5)*6, heightAt(Math.floor(vc.x),Math.floor(vc.z))+1.01, vc.z+0.5+(Math.random()-0.5)*6);
          m.home={x:vc.x,z:vc.z};
          m.trade=TRADES[(Math.random()*TRADES.length)|0];
          m.tYaw=m.yaw; mobs.push(m);
        }
      }
    }
  }
  for(let i=mobs.length-1;i>=0;i--){
    const m=mobs[i];
    const dx=m.pos.x-player.pos.x, dz=m.pos.z-player.pos.z;
    if(dx*dx+dz*dz>64*64 || m.pos.y<-10 || (m.def.ghast && player.pos.x<50000)){ killMob(m); mobs.splice(i,1); continue; }
    const dist=Math.sqrt(dx*dx+dz*dz);
    const swim=!!m.def.water, fly=!!m.def.fly;
    let sp;
    if(m===riding){                                // 骑乘中:速度由玩家输入直写
      sp=0;
    } else if(swim){                                        // 鱼:水中漫游
      m.timer-=dt;
      if(m.timer<=0){ m.timer=1.5+Math.random()*2.5; m.tYaw=Math.random()*6.283; m.vyT=(Math.random()-0.5)*1.2; }
      sp=m.def.speed;
    } else if(fly){                                  // 蝙蝠/恶魂:飞行
      m.timer-=dt;
      if(m.timer<=0){ m.timer=1+Math.random()*2; m.tYaw=Math.random()*6.283; m.vyT=(Math.random()-0.5)*1.6; }
      sp=m.def.speed;
      if(m.def.ghast && player.pos.x>=50000 && dist<24){
        m.tYaw=Math.atan2(-dx,-dz);
        m.vyT=Math.max(-1.2,Math.min(1.2,(player.pos.y+6-m.pos.y)*0.3));
        m.atkT-=dt;
        if(m.atkT<=0){ m.atkT=3.5; ghastShoot(m); }
      }
    } else if(m.type==="wolf"){
      if(m.tamed){                                   // 驯服:跟随+护主
        if(m.atk && (m.atk.hp===undefined || m.atk.hp<=0 || mobs.indexOf(m.atk)<0)) m.atk=null;
        if(!m.atk){
          let bd=81;
          for(const o of mobs){ if(!o.def.hostile) continue;
            const ox=o.pos.x-player.pos.x, oz=o.pos.z-player.pos.z, od=ox*ox+oz*oz;
            if(od<bd){ bd=od; m.atk=o; } }
        }
        const tt=m.atk?m.atk.pos:player.pos;
        const wx=tt.x-m.pos.x, wz=tt.z-m.pos.z, wd=Math.hypot(wx,wz);
        if(m.atk){
          m.tYaw=Math.atan2(wx,wz); sp=m.def.speed;
          m.atkT-=dt;
          if(wd<1.5 && m.atkT<=0){ m.atkT=0.8; sfxBark(0.8); if(damageMob(m.atk,2,wx,wz)) m.atk=null; }
        } else if(wd>2.2){ m.tYaw=Math.atan2(wx,wz); sp=m.def.speed*0.85; }
        else sp=0;
        if(!m.atk && wd>14){                         // 太远瞬移跟上
          const nx=player.pos.x+(Math.random()-0.5)*3, nz=player.pos.z+(Math.random()-0.5)*3;
          if(!boxCollides(nx,player.pos.y+0.5,nz,m.half,m.hgt)) m.pos.set(nx,player.pos.y+0.5,nz);
        }
      } else if(m.angry>0){                          // 野狼被激怒:反击
        m.angry-=dt;
        m.tYaw=Math.atan2(-dx,-dz); sp=m.def.speed;
        m.atkT-=dt;
        if(dist<1.5 && m.atkT<=0){ m.atkT=1; hurt(2); player.vel.y=3; sfxBark(1); }
      } else if(m.flee>0){
        m.flee-=dt; m.tYaw=Math.atan2(dx,dz); sp=2.6;
      } else {
        m.timer-=dt;
        if(m.timer<=0){ m.timer=2+Math.random()*5; m.walking=Math.random()<0.7; if(m.walking) m.tYaw=Math.random()*6.283; }
        sp=m.walking?m.def.speed*0.5:0;
      }
    } else if(m.def.hostile){
      // 白天燃烧(蜘蛛除外,白天变温顺)
      if(!m.def.noBurn && dayF>0.55){
        m.burn+=dt;
        if(Math.random()<dt*4) spawnParticles(m.pos.x, m.pos.y+1.2, m.pos.z, 0x555555, 1);
        if(m.burn>2.5){ killMob(m); mobs.splice(i,1); continue; }
      }
      if(dayF<0.35 && dist<14){                    // 夜晚追击
        m.tYaw=Math.atan2(-dx,-dz);
        if(m.def.ranged){                          // 骷髅:远程放箭
          sp=dist<5?-m.def.speed:0;
          m.atkT-=dt;
          if(m.atkT<=0){ m.atkT=2.5; mobShoot(m); }
        } else {
          sp=m.def.speed;
          m.atkT-=dt;
          if(dist<1.5 && m.atkT<=0){
            m.atkT=1.1; hurt(m.def.dmg||3); player.vel.y=3.5; MOB_SFX[m.def.sfx](1);
          }
        }
      } else {
        m.timer-=dt;
        if(m.timer<=0){ m.timer=2+Math.random()*4; m.tYaw=Math.random()*6.283; }
        sp=0.8;
      }
    } else if(m.flee>0){                           // 被驱赶:逃跑
      m.flee-=dt;
      m.tYaw=Math.atan2(dx,dz);
      sp=2.6;
    } else {
      m.timer-=dt;
      if(m.timer<=0){ m.timer=2+Math.random()*5; m.walking=Math.random()<0.7; if(m.walking) m.tYaw=Math.random()*6.283; }
      sp=m.walking?m.def.speed:0;
      if(m.def.villager && m.home){                // 村民不远离村庄
        const hx=m.home.x-m.pos.x, hz=m.home.z-m.pos.z;
        if(hx*hx+hz*hz>400){ m.tYaw=Math.atan2(hx,hz); sp=m.def.speed; m.walking=true; }
      }
    }
    // 繁殖:发情的同类互相靠近产崽
    if(m.love>0 && !m.baby && !swim && !fly){
      let bp=null,bd=144;
      for(const o of mobs){
        if(o===m||o.type!==m.type||o.baby||o.love<=0||o.breedCd>0||m.breedCd>0) continue;
        const ox=o.pos.x-m.pos.x, oz=o.pos.z-m.pos.z, od=ox*ox+oz*oz;
        if(od<bd){ bd=od; bp=o; }
      }
      if(bp){
        if(bd>2.5){ m.tYaw=Math.atan2(bp.pos.x-m.pos.x,bp.pos.z-m.pos.z); sp=m.def.speed; }
        else {
          m.love=0; bp.love=0; m.breedCd=60; bp.breedCd=60;
          const bb=makeMob(m.type);
          bb.baby=true;
          bb.mesh.scale.setScalar(0.55);
          bb.half=m.def.half*0.55; bb.hgt=m.def.hgt*0.55;
          bb.pos.set((m.pos.x+bp.pos.x)/2, m.pos.y+0.2, (m.pos.z+bp.pos.z)/2);
          mobs.push(bb);
          spawnParticles(bb.pos.x,bb.pos.y+1,bb.pos.z,0xff4060,10);
          ach("breed","💕 繁衍生息");
        }
      }
      m.love-=dt;
    }
    if(m.breedCd>0) m.breedCd-=dt;
    // 幼崽:成长 + 跟随父母
    if(m.baby){
      m.age+=dt;
      const s=Math.min(1,0.55+m.age/60*0.45);
      m.mesh.scale.setScalar(s);
      m.half=m.def.half*s; m.hgt=m.def.hgt*s;
      if(m.age>=60) m.baby=false;
      else if(m.flee<=0){
        let bp=null,bd=100;
        for(const o of mobs){ if(o!==m&&o.type===m.type&&!o.baby){ const ox=o.pos.x-m.pos.x,oz=o.pos.z-m.pos.z,od=ox*ox+oz*oz; if(od<bd){bd=od;bp=o;} } }
        if(bp&&bd>4){ m.tYaw=Math.atan2(bp.pos.x-m.pos.x,bp.pos.z-m.pos.z); sp=Math.max(sp,m.def.speed*0.8); }
      }
    }
    // ===== 共享运动 =====
    if(m===riding){ m.yaw+=(player.yaw-m.yaw)*Math.min(1,dt*6); }
    else {
      let dyw=m.tYaw-m.yaw;
      while(dyw>Math.PI) dyw-=6.283; while(dyw<-Math.PI) dyw+=6.283;
      m.yaw+=dyw*Math.min(1,dt*3);
    }
    const inW=getV(Math.floor(m.pos.x),Math.floor(m.pos.y+0.2),Math.floor(m.pos.z))===B.WATER;
    sp*=inW?0.7:1;
    m.kx*=Math.exp(-5*dt); m.kz*=Math.exp(-5*dt);
    if(m!==riding){ m.vel.x=Math.sin(m.yaw)*sp+m.kx; m.vel.z=Math.cos(m.yaw)*sp+m.kz; }
    if(fly||swim){ m.vel.y += ((m.vyT||0)-m.vel.y)*Math.min(1,dt*2.5); }
    else if(inW){ m.vel.y=Math.min(m.vel.y+42*dt,2.5); if(Math.random()<dt*0.5) m.tYaw=Math.random()*6.283; }
    else { m.vel.y+=GRAV*dt; if(m.vel.y<-30) m.vel.y=-30; }
    // 兔子蹦跳
    if(m.def.hop && m.onGround && sp>0){
      m.hopT=(m.hopT||0)-dt;
      if(m.hopT<=0){ m.hopT=0.35; m.vel.y=4; }
    }
    m.blocked=false; m.onGround=false;
    mobAxis(m,"x",m.vel.x*dt); mobAxis(m,"z",m.vel.z*dt); mobAxis(m,"y",m.vel.y*dt);
    if(m.blocked) m.tYaw=m.yaw+Math.PI*(0.5+Math.random());
    if(m.def.climb && m.blocked) m.vel.y=3.5;      // 蜘蛛爬墙
    // 鱼离水挣扎
    if(swim){
      const inWM=getV(Math.floor(m.pos.x),Math.floor(m.pos.y+0.1),Math.floor(m.pos.z))===B.WATER;
      if(!inWM){
        m.airT=(m.airT||0)+dt; m.vel.y=-2;
        if(m.airT>2.5){ killMob(m); mobs.splice(i,1); continue; }
      } else m.airT=0;
    }
    // 蝙蝠白天见光消散
    if(fly && dayF>0.6 && m.pos.y>WL){
      let sky=true;
      const fx=Math.floor(m.pos.x), fz=Math.floor(m.pos.z), fy=Math.floor(m.pos.y);
      for(let yy=fy+1;yy<Math.min(H,fy+12);yy++) if(getV(fx,yy,fz)!==0){ sky=false; break; }
      if(sky){ killMob(m); mobs.splice(i,1); continue; }
    }
    m.mesh.position.copy(m.pos);
    m.mesh.rotation.y=m.yaw;
    const hs=Math.hypot(m.vel.x,m.vel.z);
    if(hs>0.1 && m.onGround){
      m.phase+=dt*hs*5;
      const s=Math.sin(m.phase)*0.5;
      if(m.legs.length===4){
        m.legs[0].rotation.x=s;  m.legs[3].rotation.x=s;
        m.legs[1].rotation.x=-s; m.legs[2].rotation.x=-s;
      } else if(m.legs.length===2){
        m.legs[0].rotation.x=s; m.legs[1].rotation.x=-s;
      }
    }
    if(m.wings){ m.phase2+=dt*14; const w=Math.sin(m.phase2)*0.7;
      m.wings[0].rotation.z=w; m.wings[1].rotation.z=w; }
    if(m.tail){ m.phase2+=dt*8; m.tail.rotation.y=Math.sin(m.phase2)*0.6; }
    // 鸡下蛋
    if(m.type==="chicken" && !m.baby){
      m.eggT=(m.eggT||15)-dt;
      if(m.eggT<=0){
        m.eggT=20+Math.random()*20;
        spawnDrop(ITEM.EGG,m.pos.x,m.pos.y+0.5,m.pos.z);
        sfxCluck(0.5);
      }
    }
    m.soundT-=dt;
    if(m.soundT<=0){
      m.soundT=6+Math.random()*14;
      const sf=MOB_SFX[m.def.sfx];
      if(sf && dist<16) sf(1-dist/16);
    }
  }
}

// ---------- 火把/篝火光源池(就近 8 个) ----------
const torchLights=[];
for(let i=0;i<8;i++){ const L=new THREE.PointLight(0xffa040,0,13,1.8); scene.add(L); torchLights.push(L); }
function updateTorchLights(now){
  const px=player.pos.x, py=player.pos.y, pz=player.pos.z;
  const near=[];
  const gather=(set,fire)=>{
    for(const s of set){
      const p=s.split(",");
      const x=+p[0], y=+p[1], z=+p[2];
      const dx=x+0.5-px, dy=y+0.5-py, dz=z+0.5-pz, d2=dx*dx+dy*dy+dz*dz;
      if(d2<676) near.push({x,y,z,d2,fire});
    }
  };
  gather(torchSet,false); gather(fireSet,true);
  near.sort((a,b)=>a.d2-b.d2);
  for(let i=0;i<torchLights.length;i++){
    const L=torchLights[i];
    if(i<near.length){
      const t=near[i];
      L.position.set(t.x+0.5, t.y+0.65, t.z+0.5);
      if(t.fire){ L.color.setHex(0xff7020); L.intensity=1.25+Math.sin(now*0.012+i*2.1)*0.25; }
      else      { L.color.setHex(0xffa040); L.intensity=0.9; }
    } else L.intensity=0;
  }
}

// ---------- 血量 ----------
const heartsEl=document.getElementById("hearts"), hurtEl=document.getElementById("hurt");
let hp=20, lastHurtT=-99999, regenT=0, breathT=0, drownT=0, armor=false;
function updateHearts(){
  let s=armor?"🛡️":"";
  for(let i=0;i<10;i++) s += hp>=(i+1)*2 ? "❤️" : (hp===i*2+1 ? "💔" : "🖤");
  heartsEl.textContent=s;
}
function hurt(dmg){
  if(dmg<=0 || hp<=0) return;
  if(armor) dmg=Math.ceil(dmg*0.5);
  hp=Math.max(0,hp-dmg);
  lastHurtT=performance.now();
  shake=Math.max(shake,0.25);
  updateHearts();
  hurtEl.style.opacity=0.6;
  setTimeout(()=>hurtEl.style.opacity=0,180);
  tone(220,90,0.15,0.3,"sawtooth");
  if(hp<=0){
    player.pos.copy(spawnPoint); player.vel.set(0,0,0);
    hp=20; updateHearts();
  }
}
updateHearts();

// ---------- 合成面板 ----------
const craftEl=document.getElementById("craft");
function toggleCraft(open){
  craftOpen=open===undefined?!craftOpen:open;
  craftEl.classList.toggle("open",craftOpen);
  if(craftOpen){ renderCraft(); if(document.pointerLockElement) document.exitPointerLock(); }
}
document.getElementById("craftClose").addEventListener("click",()=>toggleCraft(false));
craftEl.addEventListener("click",e=>{ if(e.target===craftEl) toggleCraft(false); });
function nearTable(){
  const px=Math.floor(player.pos.x), py=Math.floor(player.pos.y), pz=Math.floor(player.pos.z);
  for(let x=px-4;x<=px+4;x++) for(let y=py-3;y<=py+3;y++) for(let z=pz-4;z<=pz+4;z++)
    if(getV(x,y,z)===B.CRAFT_TABLE) return true;
  return false;
}
function iconOf(id){ return id<100 ? tileIcon(id) : itemIcon(id); }
function renderCraft(){
  const rec=document.getElementById("recipes"); rec.innerHTML="";
  const nt=nearTable();
  RECIPES.forEach(r=>{
    const row=document.createElement("div"); row.className="rrow";
    const mk=(id,n)=>{ const w=document.createElement("span"); w.className="ric"; w.title=NAME[id]||id;
      w.appendChild(iconOf(id));
      const s=document.createElement("span"); s.className="rn"; s.textContent="×"+n; w.appendChild(s); return w; };
    row.appendChild(mk(r.out,r.n));
    const ar=document.createElement("span"); ar.className="arrow"; ar.textContent="⇐"; row.appendChild(ar);
    for(const k in r.need) row.appendChild(mk(+k,r.need[k]));
    if(r.table && !nt){ const tg=document.createElement("span"); tg.className="need"; tg.textContent="需合成台"; row.appendChild(tg); }
    const btn=document.createElement("button"); btn.textContent="合成";
    const can=(!r.table||nt) && Object.keys(r.need).every(k=>(inv[k]||0)>=r.need[k]);
    btn.disabled=!can;
    btn.addEventListener("click",()=>{
      for(const k in r.need) inv[k]-=r.need[k];
      invAdd(r.out,r.n); sfxPlace(); renderCraft();
      if(r.out===B.TORCH) ach("torch","🔥 光明使者");
      else if(r.out===B.CRAFT_TABLE) ach("table","🔨 工匠之心");
      else if(r.out===ITEM.ELYTRA) ach("elytra","🪂 准备起飞");
      else if(r.out===ITEM.BOW) ach("bow","🏹 神射手");
      else if(r.out===B.TNT) ach("tntcraft","🧨 危险物品");
    });
    row.appendChild(btn);
    rec.appendChild(row);
  });
  const grid=document.getElementById("invGrid"); grid.innerHTML="";
  for(const id of Object.keys(inv)){
    if((inv[id]||0)<=0) continue;
    const cell=document.createElement("div"); cell.className="icell";
    cell.appendChild(iconOf(+id));
    const c=document.createElement("span"); c.className="cnt"; c.textContent=inv[id]; cell.appendChild(c);
    cell.title=NAME[id]||id;
    if(FOODS.indexOf(+id)>=0){
      cell.style.borderColor="#e8a050";
      cell.addEventListener("click",()=>eatFood(+id));
    } else if(+id===ITEM.RECALL){
      cell.style.borderColor="#c090ff";
      cell.addEventListener("click",useRecall);
    } else if(+id===ITEM.ARMOR){
      cell.style.borderColor="#90c0ff";
      cell.addEventListener("click",equipArmor);
    }
    grid.appendChild(cell);
  }
}
function eatFood(id){
  if((inv[id]||0)<=0 || hp>=20) return;
  const heal=id===ITEM.COOKED?5:(id===ITEM.COOKEDFISH?4:(id===ITEM.APPLE?3:1));
  inv[id]--; hp=Math.min(20,hp+heal);
  updateHearts();
  burst(0.07,600,0.2); setTimeout(()=>burst(0.07,520,0.18),120);
  updateInvUI(); renderCraft();
}
const FOODS=[ITEM.RAW,ITEM.COOKED,ITEM.RAWFISH,ITEM.COOKEDFISH,ITEM.APPLE];
function useRecall(){
  if((inv[ITEM.RECALL]||0)<=0) return;
  inv[ITEM.RECALL]--; updateInvUI(); renderCraft();
  player.pos.copy(spawnPoint); player.vel.set(0,0,0);
  tone(500,900,0.25,0.25);
  spawnParticles(player.pos.x,player.pos.y+1,player.pos.z,0xc090ff,18);
  showToast("✨ 回到出生点");
}
function equipArmor(){
  if(armor){ showToast("已装备铁甲"); return; }
  if((inv[ITEM.ARMOR]||0)<=0) return;
  inv[ITEM.ARMOR]--; updateInvUI(); renderCraft();
  armor=true; updateHearts();
  tone(300,500,0.15,0.25);
  showToast("🛡️ 铁甲装备完成,伤害减半");
}

// ---------- 喂食 / 驯服 ----------
const FEEDABLE=["pig","cow","sheep","chicken","rabbit"];
function canFeed(m){
  return ((m.type==="wolf"||m.type==="horse") && !m.tamed) || (FEEDABLE.indexOf(m.type)>=0 && !m.baby);
}
function feedTarget(){
  const mh=raycastMob(); if(!mh || mh.t>3.5) return;
  const m=mh.m;
  if(!canFeed(m)) return;
  const item=(inv[ITEM.RAW]||0)>0 ? ITEM.RAW : ((inv[ITEM.COOKED]||0)>0 ? ITEM.COOKED : 0);
  if(!item) return;
  inv[item]--; updateInvUI();
  if(m.type==="wolf"||m.type==="horse"){
    if(Math.random()<0.4){                          // 驯服成功
      m.tamed=true; m.angry=0; m.flee=0;
      if(m.type==="wolf"){ addCollar(m); sfxBark(1); ach("wolf","🐺 忠实伙伴"); }
      else { addSaddle(m); sfxNeigh(1); ach("horse","🐎 牛仔"); showToast("🐎 马驯服了!对准它按 R 骑乘"); }
      spawnParticles(m.pos.x,m.pos.y+1,m.pos.z,0xff4060,10);
    } else spawnParticles(m.pos.x,m.pos.y+1,m.pos.z,0x999999,6);
  } else {
    m.love=30;                                      // 发情
    spawnParticles(m.pos.x,m.pos.y+1,m.pos.z,0xff4060,8);
    burst(0.08,800,0.2);
  }
}
function toggleRide(){
  if(riding){ riding=null; showToast("已下来"); return; }
  const bh=raycastBoat();
  if(bh){ riding=bh.b; showToast("🚣 划船中,R 下船"); return; }
  const mh=raycastMob(); if(!mh || mh.t>3.5) return;
  const m=mh.m;
  if(m.type==="horse"&&m.tamed){ riding=m; showToast("🐎 骑乘中:移动+空格跳跃,R 下马"); sfxNeigh(0.8); }
}

// ---------- 存档(localStorage) ----------
const SAVE_KEY="mcclone_v1";
let savedWolves=[];
function saveGame(){
  try{
    const edits={};
    for(const [k,m] of EDITS) edits[k]=[...m];
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      pos:[player.pos.x,player.pos.y,player.pos.z],
      yaw:player.yaw, pitch:player.pitch, sel:selBlock,
      dayT, hp, inv, edits, armor, achv,
      wolves: mobs.filter(m=>m.type==="wolf"&&m.tamed).map(m=>[m.pos.x,m.pos.y,m.pos.z])
    }));
  }catch(e){}
}
function loadGame(){
  try{
    const s=localStorage.getItem(SAVE_KEY); if(!s) return false;
    const d=JSON.parse(s);
    if(d.edits) for(const k in d.edits){
      const m=new Map(d.edits[k]);
      EDITS.set(k,m);
      const cp=k.split(","), cx=+cp[0], cz=+cp[1];
      for(const [i,b] of m){
        if(b===B.TORCH) torchSet.add((cx*16+(i&15))+","+(i>>8)+","+(cz*16+((i>>4)&15)));
        else if(b===B.CAMPFIRE) fireSet.add((cx*16+(i&15))+","+(i>>8)+","+(cz*16+((i>>4)&15)));
      }
    }
    if(d.pos) player.pos.set(d.pos[0],d.pos[1],d.pos[2]);
    spawnPoint.copy(player.pos);                    // 读档后重生点=当前位置
    player.yaw=d.yaw||0; player.pitch=d.pitch||0;
    selectSlot(d.sel||0);
    if(d.inv) Object.assign(inv,d.inv);
    if(typeof d.dayT==="number") dayT=d.dayT;
    if(typeof d.hp==="number") hp=d.hp;
    savedWolves=d.wolves||[];
    armor=!!d.armor;
    if(d.achv) Object.assign(achv,d.achv);
    updateInvUI(); updateHearts();
    return true;
  }catch(e){ return false; }
}
addEventListener("pagehide",saveGame);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveGame(); });

// ---------- 主循环 ----------
function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize",resize);

let dayT=0.3;
let last=performance.now(), breakTimer=0, fpsAcc=0, fpsN=0, fpsShow=0;
let wasInWater=false, stepAcc=0, bobPhase=0, saveT=0, torchT=0, smokeT=0, cookT=0, doorT=0, lavaT=0;
let shake=0, wTapT=0, dblSprint=false, riding=null, arrowCd=0;
let weather=0, weatherTarget=0, weatherT=90, thunderT=6, flash=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min(0.05,(now-last)/1000); last=now;

  ensureChunks();

  // 移动输入
  let mf=(keys.KeyW?1:0)-(keys.KeyS?1:0) - joy.y;
  let ms=(keys.KeyD?1:0)-(keys.KeyA?1:0) + joy.x;
  const ml=Math.hypot(mf,ms); if(ml>1){ mf/=ml; ms/=ml; }
  const sin=Math.sin(player.yaw), cos=Math.cos(player.yaw);

  // 水状态
  const fbx=Math.floor(player.pos.x), fbz=Math.floor(player.pos.z);
  const inWater = getV(fbx,Math.floor(player.pos.y+0.1),fbz)===B.WATER
               || getV(fbx,Math.floor(player.pos.y+1.0),fbz)===B.WATER;
  const joyMag=Math.hypot(joy.x,joy.y);
  const sprinting=(keys.ShiftLeft||dblSprint||joyMag>0.92) && mf>0.3 && !inWater && !riding;
  let gliding=false;
  if(riding && (riding.isBoat ? boats.indexOf(riding)>=0 : (riding.hp>0 && mobs.indexOf(riding)>=0))){
    // 骑乘:输入直接驱动坐骑
    const m=riding, rspd=riding.isBoat?7:8.5;
    m.vel.x=(-sin*mf+cos*ms)*rspd; m.vel.z=(-cos*mf-sin*ms)*rspd;
    m.yaw=player.yaw;
    if(!m.isBoat && (keys.Space||btnJumpHeld) && m.onGround) m.vel.y=9;
    player.vel.set(0,0,0);
  } else {
    if(riding) riding=null;
    const spd=(inWater?SPEED*0.55:SPEED)*(sprinting?1.55:1);
    player.vel.x = (-sin*mf + cos*ms)*spd;
    player.vel.z = (-cos*mf - sin*ms)*spd;
    if(inWater){
      player.vel.y += -9*dt;
      if(keys.Space||btnJumpHeld) player.vel.y = Math.min(player.vel.y+42*dt, 3.2);
      player.vel.y = Math.max(player.vel.y, -3.2);
      player.onGround=false;
    } else {
      if((keys.Space||btnJumpHeld) && player.onGround){ player.vel.y=JUMP_V; player.onGround=false; }
      player.vel.y += GRAV*dt;
      if(player.vel.y<-40) player.vel.y=-40;
      player.onGround=false;
    }
    // 鞘翅滑翔:空中按住跳跃
    gliding=(inv[ITEM.ELYTRA]||0)>0 && !player.onGround && !inWater && (keys.Space||btnJumpHeld) && player.vel.y<0.5;
    if(gliding){
      const look=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
      player.vel.x=look.x*9; player.vel.z=look.z*9;
      player.vel.y=Math.max(player.vel.y, -1.3-Math.max(0,-look.y)*5);
      if(Math.random()<dt*6) burst(0.1,900,0.06);
      ach("glide","🪂 起飞!");
    }
    if(inWater && !wasInWater && player.vel.y<-3) sfxSplash();
    wasInWater = inWater;

    const vyBefore=player.vel.y;
    moveAxis("x", player.vel.x*dt);
    moveAxis("z", player.vel.z*dt);
    moveAxis("y", player.vel.y*dt);
    if(player.onGround && vyBefore<-13 && !inWater){
      burst(0.12,300,0.3);
      hurt(Math.floor((-vyBefore-12)*0.8));              // 摔落伤害
    }
    if(player.pos.y<-20){ player.pos.y=heightAt(fbx,fbz)+2; player.vel.set(0,0,0); }

    // 脚步声
    if(player.onGround){
      const hs0=Math.hypot(player.vel.x,player.vel.z);
      if(hs0>1){ stepAcc+=hs0*dt; if(stepAcc>2.2){ stepAcc=0; sfxStep(getV(fbx,Math.floor(player.pos.y-0.5),fbz)); } }
    }
  }
  const targetFov=gliding?92:(sprinting?85:75);
  if(Math.abs(camera.fov-targetFov)>0.05){
    camera.fov+=(targetFov-camera.fov)*Math.min(1,dt*8);
    camera.updateProjectionMatrix();
  }
  const hSpeed=Math.hypot(player.vel.x,player.vel.z);

  // 相机
  camera.position.set(player.pos.x, player.pos.y+EYE, player.pos.z);
  camera.rotation.y=player.yaw; camera.rotation.x=player.pitch;
  // 屏幕震动
  if(shake>0){
    shake=Math.max(0,shake-dt*1.5);
    camera.position.x+=(Math.random()-0.5)*shake*0.5;
    camera.position.y+=(Math.random()-0.5)*shake*0.5;
    camera.rotation.z=(Math.random()-0.5)*shake*0.06;
  } else camera.rotation.z=0;

  // 头部是否没入水中
  const uw = getV(Math.floor(camera.position.x),Math.floor(camera.position.y),Math.floor(camera.position.z))===B.WATER;

  // 溺水
  if(uw){ breathT+=dt; if(breathT>10){ drownT+=dt; if(drownT>1){ drownT=0; hurt(2); } } }
  else { breathT=0; drownT=0; }
  // 岩浆灼烧
  const inLava=getV(fbx,Math.floor(player.pos.y+0.1),fbz)===B.LAVA || getV(fbx,Math.floor(player.pos.y+1.2),fbz)===B.LAVA;
  if(inLava){ lavaT+=dt; if(lavaT>0.5){ lavaT=0; hurt(4); } } else lavaT=0;
  // 压力板&门
  doorT+=dt; if(doorT>0.2){ doorT=0; updateDoors(); }
  // 缓慢回血
  if(hp<20 && now-lastHurtT>6000){ regenT+=dt; if(regenT>1.5){ regenT=0; hp++; updateHearts(); } }

  // ===== 日夜循环 =====
  dayT=(dayT+dt/DAY_LEN)%1;
  const ang=dayT*Math.PI*2, sunEl=Math.sin(ang);
  const dayF=sstep(-0.06,0.18,sunEl);
  const duskF=Math.max(0,1-Math.abs(sunEl)*3.5);
  skyCol.copy(nightSkyCol).lerp(daySkyCol,dayF);
  if(duskF>0) skyCol.lerp(duskCol,duskF*0.5);
  skyCol.multiplyScalar(1-weather*0.4);                        // 雨天变暗
  const inNether=player.pos.x>=50000;
  if(inNether) skyCol.set(0x2a0d08);                           // 下界暗红天空
  if(flash>0){ flash=Math.max(0,flash-dt*3); skyCol.lerp(tmpCol.set(0xffffff),flash*0.6); }
  if(uw){
    tmpCol.set(0x14406e).multiplyScalar(0.25+0.75*dayF);
    scene.background.copy(tmpCol); scene.fog.color.copy(tmpCol);
    scene.fog.near=1; scene.fog.far=14;
  } else if(inNether){
    scene.background.copy(skyCol); scene.fog.color.copy(skyCol);
    scene.fog.near=8; scene.fog.far=42;
  } else {
    scene.background.copy(skyCol); scene.fog.color.copy(skyCol);
    scene.fog.near=FOG_NEAR; scene.fog.far=FOG_FAR*(1-weather*0.35);
  }
  sun.intensity=inNether?0.2:0.1+0.85*dayF;
  sun.color.set(0xfff2d8).lerp(tmpCol.set(0xff8840), duskF*0.8);
  hemi.intensity=0.2+0.55*dayF+flash*1.5;
  sunDirV.set(Math.cos(ang),sunEl,0.25).normalize();
  sunSpr.position.copy(camera.position).addScaledVector(sunDirV,240);
  moonSpr.position.copy(camera.position).addScaledVector(sunDirV,-240);
  sunSpr.material.opacity=sstep(-0.15,0.05,sunEl);
  moonSpr.material.opacity=sstep(-0.05,0.15,-sunEl);
  stars.position.copy(camera.position);
  starMat.opacity=(1-dayF)*0.9;
  cloudMat.color.setScalar((0.3+0.7*dayF)*(1-weather*0.4));
  const ld = sunEl>-0.05 ? sunDirV : tmpV.copy(sunDirV).negate();
  sun.position.copy(player.pos).addScaledVector(ld,120);
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();

  // ===== 天气:雨/雷暴 =====
  weatherT-=dt;
  if(weatherT<=0){
    const wasRain=weatherTarget>0.5;
    weatherTarget=weatherTarget>0.5?0:1;
    weatherT=weatherTarget?60+Math.random()*60:120+Math.random()*120;
    if(weatherTarget) showToast("🌧️ 下雨了");
    else if(wasRain){ rainbowT=40; rainbowDir=Math.random()*6.283; showToast("🌈 彩虹!"); }
  }
  weather+=(weatherTarget-weather)*Math.min(1,dt*0.2);
  if(rainGain) rainGain.gain.value=weather*0.09;
  if(weather>0.02 && !inNether){
    rain.visible=true; rainMat.opacity=weather*0.55;
    const ccx=camera.position.x, ccy=camera.position.y, ccz=camera.position.z;
    for(let i=0;i<RAIN_N;i++){
      const d=rainDrops[i];
      d.y-=22*dt; if(d.y<0) d.y+=20;
      const wy=ccy-6+d.y, j=i*6;
      rainPos[j]=ccx+d.x;   rainPos[j+1]=wy;      rainPos[j+2]=ccz+d.z;
      rainPos[j+3]=ccx+d.x+0.07; rainPos[j+4]=wy-0.55; rainPos[j+5]=ccz+d.z;
    }
    rainGeo.attributes.position.needsUpdate=true;
  } else rain.visible=false;
  if(weather>0.5){
    thunderT-=dt;
    if(thunderT<=0){
      thunderT=4+Math.random()*8;
      flash=1;
      const a=Math.random()*6.283, dd=10+Math.random()*30;
      const lx=player.pos.x+Math.cos(a)*dd, lz=player.pos.z+Math.sin(a)*dd;
      const ly=heightAt(Math.floor(lx),Math.floor(lz));
      const pts=[]; let ppx=lx, ppz=lz;
      for(let k=0;k<=7;k++){ pts.push(ppx, ly+(64-ly)*k/7, ppz); ppx+=(Math.random()-0.5)*4; ppz+=(Math.random()-0.5)*4; }
      boltGeo.setAttribute("position", new THREE.Float32BufferAttribute(pts,3));
      boltMat.opacity=0.9;
      setTimeout(()=>{ burst(0.9,90,0.8); tone(50,25,0.9,0.5,"sawtooth"); }, 200+Math.random()*1200);
    }
  }
  if(boltMat.opacity>0) boltMat.opacity=Math.max(0,boltMat.opacity-dt*4);
  // 彩虹
  if(rainbowT>0){
    rainbowT-=dt;
    rainbowSpr.position.set(camera.position.x+Math.cos(rainbowDir)*180, 24, camera.position.z+Math.sin(rainbowDir)*180);
    rainbowSpr.material.opacity=Math.min(0.45,rainbowT*0.05)*dayF;
  } else rainbowSpr.material.opacity=0;

  // 云朵跟随
  clouds.position.x=player.pos.x; clouds.position.z=player.pos.z;
  cloudTex.offset.set((player.pos.x*0.005+now*0.00002)%1, (player.pos.z*0.005)%1);

  // 手部:挥动 + 行走摇晃
  if(swingT>0){ swingT=Math.max(0,swingT-dt*3.5); handG.rotation.x=-Math.sin((1-swingT)*Math.PI)*1.1; }
  bobPhase+=hSpeed*dt*1.5;
  handG.position.y=-0.42+(player.onGround?Math.sin(bobPhase)*0.012:0);

  // 水面/岩浆流动
  waterTex.offset.x = (now*0.000020)%1;
  waterTex.offset.y = (now*0.000013)%1;
  lavaTex.offset.x = (now*0.000015)%1;
  lavaTex.offset.y = (now*0.000009)%1;

  // 火把/篝火光源
  torchT+=dt; if(torchT>0.3){ torchT=0; updateTorchLights(now); }

  // 篝火:烟雾 + 自动烤肉
  smokeT+=dt;
  if(smokeT>0.35){
    smokeT=0;
    for(const s of fireSet){
      const p=s.split(","), x=+p[0]+0.5, y=+p[1]+1, z=+p[2]+0.5;
      if((x-player.pos.x)**2+(z-player.pos.z)**2<900) spawnSmoke(x,y,z);
    }
  }
  cookT+=dt;
  if(cookT>3){
    cookT=0;
    let rawId=0, cookedId=0;
    if((inv[ITEM.RAW]||0)>0){ rawId=ITEM.RAW; cookedId=ITEM.COOKED; }
    else if((inv[ITEM.RAWFISH]||0)>0){ rawId=ITEM.RAWFISH; cookedId=ITEM.COOKEDFISH; }
    else if((inv[B.IRON_ORE]||0)>0){ rawId=B.IRON_ORE; cookedId=ITEM.IRON_INGOT; }  // 熔炼铁矿
    if(rawId){
      for(const s of fireSet){
        const p=s.split(",");
        const dx=+p[0]+0.5-player.pos.x, dy=+p[1]+0.5-player.pos.y, dz=+p[2]+0.5-player.pos.z;
        if(dx*dx+dy*dy+dz*dz<12){
          inv[rawId]--; invAdd(cookedId,1); sfxSizzle();
          spawnParticles(+p[0]+0.5,+p[1]+1,+p[2]+0.5,0xffa040,4);
          break;
        }
      }
    }
  }

  // 实体
  updateMobs(dt,dayF);
  updateParticles(dt);
  updateDrops(dt);
  updateTnts(dt);
  updateArrows(dt);
  updateEggs(dt);
  updateFishing(dt);
  updateBoats(dt);
  updateFireballs(dt);
  if(riding) player.pos.set(riding.pos.x, riding.pos.y+(riding.isBoat?1.1:1.45), riding.pos.z);

  // 持续挖掘/攻击
  breakTimer-=dt;
  if((mouseBreak||btnBreakHeld) && breakTimer<=0){ attack(); breakTimer=mineSpeed(); }

  // 高亮选中方块
  const hit=raycastVoxel();
  if(hit){ hl.visible=true; hl.position.set(hit.x+0.5,hit.y+0.5,hit.z+0.5); }
  else hl.visible=false;

  // 喂食/骑乘/弓箭按钮
  feedT-=dt;
  if(feedT<=0){
    feedT=0.15;
    const mh=raycastMob();
    const ok=mh && mh.t<3.5 && canFeed(mh.m) && ((inv[ITEM.RAW]||0)>0||(inv[ITEM.COOKED]||0)>0);
    btnFeed.style.display=ok?"flex":"none";
    btnRide.style.display=(riding||raycastBoat()||(mh && mh.t<3.5 && mh.m.type==="horse" && mh.m.tamed))?"flex":"none";
    btnBow.style.display=(inv[ITEM.BOW]||0)>0?"flex":"none";
    btnEgg.style.display=(inv[ITEM.EGG]||0)>0?"flex":"none";
    btnFish.style.display=(inv[ITEM.ROD]||0)>0?"flex":"none";
    btnBoat.style.display=(inv[ITEM.BOAT]||0)>0?"flex":"none";
    btnTrade.style.display=(mh && mh.t<3.5 && mh.m.def.villager)?"flex":"none";
  }

  // 自动存档
  saveT+=dt; if(saveT>8){ saveT=0; saveGame(); }

  // 坐标/FPS
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>0.5){ fpsShow=Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0;
    const hh=Math.floor(dayT*24), mm=Math.floor((dayT*24-hh)*60);
    document.getElementById("coords").textContent =
      `XYZ: ${player.pos.x.toFixed(1)} / ${player.pos.y.toFixed(1)} / ${player.pos.z.toFixed(1)}  FPS: ${fpsShow}  区块: ${chunkMeshes.size}  ${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
  }
  renderer.render(scene,camera);
}

// ---------- 启动:读档或新生成,同步预生成周边,其余边玩边加载 ----------
if(!loadGame()) spawn();
else {
  // 地形算法可能变过:深水区则迁去附近陆地,被埋则抬到地表
  const px=Math.floor(player.pos.x), pz=Math.floor(player.pos.z), gh=heightAt(px,pz);
  if(gh<WL-1){
    const s=findLand(px,pz,300);
    if(s) player.pos.set(s.x+0.5, Math.max(s.h,WL)+1.01, s.z+0.5);
  } else if(player.pos.y<gh+0.5) player.pos.y=gh+1.01;
  spawnPoint.copy(player.pos);
}
const pcx0=Math.floor(player.pos.x/CH), pcz0=Math.floor(player.pos.z/CH);
for(let dx=-2;dx<=2;dx++) for(let dz=-2;dz<=2;dz++){
  const cx=pcx0+dx, cz=pcz0+dz;
  chunksData.set(ckey(cx,cz), {cx, cz, d:genChunkData(cx,cz)});
}
for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++) buildChunk(pcx0+dx,pcz0+dz);
// 恢复驯服的狼
for(const w of savedWolves){
  const m=makeMob("wolf");
  m.tamed=true; addCollar(m);
  m.pos.set(w[0],w[1],w[2]); m.tYaw=m.yaw;
  mobs.push(m);
}
resize();
requestAnimationFrame(loop);
</script>
</body>
